# cargo fuzz targets for the parsers on the trust boundary of the Rust core. A workspace of its own, so the
# libFuzzer dependency and its nightly toolchain never reach the published crates or `cargo deny` of the root
# workspace. Run one target with `cargo +nightly fuzz run <target> -- -dict=dict/<dict> -max_total_time=60`
# from this folder (Linux or macOS; libFuzzer needs a sanitizer the MSVC toolchain does not provide).

[package]
name = "canopy-fuzz"
description = "cargo fuzz targets for EJSON, BSON, filters, updates, regular expressions, client frames, auth and WebAuthn."
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
base64ct = { version = "1.8", features = ["alloc"] }
bson = "3"
canopy-auth = { path = "../crates/canopy-auth" }
canopy-authn = { path = "../crates/canopy-authn" }
canopy-engine = { path = "../crates/canopy-engine" }
canopy-matcher = { path = "../crates/canopy-matcher" }
canopy-protocol = { path = "../crates/canopy-protocol" }
canopy-webauthn = { path = "../crates/canopy-webauthn" }
canopy-wire = { path = "../crates/canopy-wire" }
hex = "0.4"
libfuzzer-sys = "0.4.10"
reqwest = { version = "0.13", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }

[[bin]]
name = "ejson"
path = "fuzz_targets/ejson.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bson"
path = "fuzz_targets/bson.rs"

# Personal hooks belong in lefthook-local.yml, which is not committed.
pre-commit:
  commands:
    biome:
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts,json,jsonc,css}"
      run: bunx biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    format:
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts,json,jsonc,css,html,md,yml,yaml,vue,svelte}"
      run: bun fmt --check --no-error-on-unmatched-pattern --ignore-unknown {staged_files}
    repo-check:
      run: bun tools/repo-check/src/cli.ts workspace dashes

commit-msg:
  commands:
    repo-check:
      run: bun tools/repo-check/src/cli.ts commit-msg {1}

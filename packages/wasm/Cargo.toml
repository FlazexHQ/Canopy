[package]
name = "canopy-wasm"
description = "The WebAssembly port of the Canopy core for Cloudflare Workers and browsers (wasm32-unknown-unknown through wasm-bindgen): the policy engine, the event matcher, query canonicalization and the EJSON codec."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
include = ["/src/**/*.rs", "/Cargo.toml"]

[lib]
crate-type = ["cdylib"]

[features]
default = ["client", "authoring"]
client = []
authoring = ["dep:canopy-config", "dep:canopy-policy", "dep:canopy-query", "dep:canopy-schema"]

[dependencies]
canopy-config = { path = "../../crates/canopy-config", optional = true }
canopy-matcher = { path = "../../crates/canopy-matcher" }
canopy-policy = { path = "../../crates/canopy-policy", optional = true }
canopy-port = { path = "../../crates/canopy-port" }
canopy-protocol = { path = "../../crates/canopy-protocol" }
canopy-query = { path = "../../crates/canopy-query", optional = true }
canopy-schema = { path = "../../crates/canopy-schema", optional = true }
js-sys = "0.3"
wasm-bindgen = "0.2"

[lints.rust]
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

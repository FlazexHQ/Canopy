# Canopy with separate Rust data and TypeScript control planes.
#   docker compose -f deploy/compose/split.yaml up -d --build --wait
#
# Services, each with its own restart policy and health check:
#   database  MongoDB replica set for application data and shared metadata
#   data      Rust REST, GraphQL, realtime and the MongoDB wire endpoint; storage with a gateway config
#   control   Built in auth when enabled, admin, policy publishing and webhooks
#   studio    Static admin dashboard
#   edge      Public HTTP entry on port 8080; routes independently and returns 503 for an unavailable service
#
# Set CANOPY_PUBLISHABLE_KEYS and CANOPY_SECRET_KEYS in the environment or .env. External JWT settings
# use the same variables as canopy.yaml. Add split-auth.yaml to enable
# built in auth instead. Set CANOPY_GATEWAY_CONFIG for storage or other gateway settings and CANOPY_CONTROL_CONFIG
# for control settings. Image transforms at /storage/v1/render are unavailable in this topology.
# To combine custom gateway settings with built in auth, use split.yaml with your own control and gateway
# configs. Set CANOPY_PUBLIC_URL and use the issuer, audience and revocation settings shown in split-auth.yaml.
# Control publishes CANOPY_POLICY_DIR on each start. Set CANOPY_PUBLISH_POLICIES=off to manage published
# policy versions through the CLI or Studio. Both planes read the shared CANOPY_META_DB.
# For local file storage, set storage.backend.root to /app/storage in the gateway config.
# MongoDB and the wire endpoint are published on loopback (ports 27017 and 27018 by default).

name: canopy-split

x-common: &common
  MONGODB_URI: mongodb://database:27017/?replicaSet=rs0
  CANOPY_DB: ${CANOPY_DB:-app}
  CANOPY_META_DB: ${CANOPY_META_DB:-canopy}
  CANOPY_PUBLISHABLE_KEYS: ${CANOPY_PUBLISHABLE_KEYS:?Set CANOPY_PUBLISHABLE_KEYS}
  CANOPY_SECRET_KEYS: ${CANOPY_SECRET_KEYS:?Set CANOPY_SECRET_KEYS}
  CANOPY_JWT_JWKS_URL: ${CANOPY_JWT_JWKS_URL:-}
  CANOPY_JWT_ISSUER: ${CANOPY_JWT_ISSUER:-}
  CANOPY_JWT_AUDIENCE: ${CANOPY_JWT_AUDIENCE:-}
  CANOPY_JWT_ALGORITHMS: ${CANOPY_JWT_ALGORITHMS:-}
  CANOPY_JWT_ROLES_CLAIM: ${CANOPY_JWT_ROLES_CLAIM:-}
  CANOPY_LOG_LEVEL: ${CANOPY_LOG_LEVEL:-info}
  CANOPY_METRICS_TOKEN: ${CANOPY_METRICS_TOKEN:-}
  CANOPY_TRUSTED_PROXIES: 172.29.0.10

services:
  database:
    extends:
      file: canopy.yaml
      service: database

  data:
    image: ${CANOPY_GATEWAY_IMAGE:-canopyd:dev}
    build:
      context: ../..
      dockerfile: deploy/docker/canopyd.Dockerfile
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      <<: *common
      CANOPY_DATA_PLANE_ROUTES: all
      CANOPY_POLICIES: database
      CANOPY_NODE_ID: data-1
    ports:
      - "127.0.0.1:${CANOPY_WIRE_PORT:-27018}:27018"
      - "127.0.0.1:${CANOPY_METRICS_PORT:-9464}:9464"
    volumes:
      - ${CANOPY_GATEWAY_CONFIG:-./split-gateway.json}:/app/gateway.json:ro
      - storage-data:/app/storage
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "/usr/local/bin/canopyd", "--probe"]
      interval: 5s
      timeout: 5s
      retries: 24

  control:
    image: ${CANOPY_IMAGE:-canopy:dev}
    build:
      context: ../..
      dockerfile: deploy/docker/canopy.Dockerfile
      additional_contexts:
        canopyjs: ../../../Canopy.js
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    stop_grace_period: 20s
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r = await fetch('http://127.0.0.1:8080/readyz'); process.exit(r.ok ? 0 : 1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
    entrypoint:
      ["bun", "--preload", "/app/publish-policies.ts", "packages/server/dist/bin/canopy-server.js"]
    command: ["--config", "/app/canopy.config.ts"]
    environment:
      <<: *common
      CANOPY_ROLE: control
      CANOPY_NODE_ID: control-1
      CANOPY_ENV: ${CANOPY_ENV:-development}
      CANOPY_MASTER_KEY: ${CANOPY_MASTER_KEY:-}
      CANOPY_PUBLIC_URL: ${CANOPY_PUBLIC_URL:-}
      CANOPY_POLICIES: ""
      CANOPY_PUBLISH_POLICIES: ${CANOPY_PUBLISH_POLICIES:-on}
    ports:
      - "127.0.0.1:${CANOPY_CONTROL_METRICS_PORT:-9465}:9464"
    volumes:
      - ${CANOPY_POLICY_DIR:-./policies}:/app/policies:ro
      - ./publish-policies.ts:/app/publish-policies.ts:ro
      - ${CANOPY_CONTROL_CONFIG:-./split-control.ts}:/app/canopy.config.ts:ro

  studio:
    extends:
      file: canopy.yaml
      service: studio

  edge:
    extends:
      file: canopy.yaml
      service: edge
    volumes:
      - ../helm/canopy/files/Caddyfile.split:/etc/caddy/Caddyfile:ro
    networks:
      default:
        ipv4_address: 172.29.0.10

networks:
  default:
    ipam:
      config:
        - subnet: 172.29.0.0/24

volumes:
  database-data: {}
  edge-data: {}
  storage-data: {}

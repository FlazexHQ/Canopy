    app.kubernetes.io/component: edge
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: canopy
    app.kubernetes.io/instance: canopy
    app.kubernetes.io/component: edge
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canopy-data
  labels:
    app.kubernetes.io/name: canopy
    app.kubernetes.io/instance: canopy
    app.kubernetes.io/component: data
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: canopy
      app.kubernetes.io/instance: canopy
      app.kubernetes.io/component: data
  template:
    metadata:
      labels:
        app.kubernetes.io/name: canopy
        app.kubernetes.io/instance: canopy
        app.kubernetes.io/component: data
      annotations:
        checksum/canopy-split: b8bd1c7292b13c05e1d42f9d2be9da74e5c327f5794f11fb5ce7b132315927b9
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: data
          image: "canopy:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9464
            - name: wire
              containerPort: 27018
          envFrom:
            - secretRef:
                name: canopy
          env:
            - name: CANOPY_DB
              value: "app"
            - name: CANOPY_ENV
              value: "production"
            - name: CANOPY_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CANOPY_ROLE
              value: api
            - name: CANOPY_POLICIES
              value: database
            - name: CANOPY_DATA_PLANE_ROUTES
              value: all
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: settings
              mountPath: /app/gateway.json
              subPath: gateway.json
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: settings
          configMap:
            name: canopy-split
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: canopy-split-policies
data:
  policy-bundle.json: |
    {
      "version": 1,
      "collections": [
        {
          "collection": "notes",
          "exposed": true,
          "realtime": true,
          "policies": [
            {
              "name": "permissive read #1",
              "kind": "permissive",
              "ops": [
                "read"
              ],
              "roles": [
                "authenticated"
              ],
              "using": {
                "ownerId": {
                  "$auth": "sub"
                }
              }
            },
            {
              "name": "permissive insert #2",
              "kind": "permissive",
              "ops": [
                "insert"
              ],
              "roles": [
                "authenticated"
              ],
              "check": {
                "ownerId": {
                  "$auth": "sub"
                }
              }
            },
            {
              "name": "permissive update #3",
              "kind": "permissive",
              "ops": [
                "update"
              ],
              "roles": [
                "authenticated"
              ],
              "using": {
                "ownerId": {
                  "$auth": "sub"
                }
              },
              "check": {
                "ownerId": {
                  "$auth": "sub"
                }
              }
            },
            {
              "name": "permissive delete #4",
              "kind": "permissive",
              "ops": [
                "delete"
              ],
              "roles": [
                "authenticated"
              ],
              "using": {
                "ownerId": {
                  "$auth": "sub"
                }
              }
            }
          ]
        }
      ],
      "contexts": {}
    }
---

# Deploy this set in place of canopy.yaml. It uses the same canopy Secret and external MongoDB replica set.
# Replace the example files in ConfigMap canopy-split-policies before exposing the edge.
# Control publishes them to the shared meta database at startup. Restart control after changing them.
# Point ingress at Service canopy. The direct MongoDB wire listener is on Service canopy-data port 27018.
# Configure gateway.json for storage. Mount settings containing credentials from a Secret.
# For built in auth, give canopy-auth a config with auth.kind=builtin and set an HTTPS CANOPY_PUBLIC_URL in the shared Secret.
# In gateway.json configure auth.issuer as that URL plus /auth/v1, auth.audience as the URL,
# auth.builtinJwks as true, auth.algorithms as ["EdDSA"],
# auth.rolesClaim as roles and auth.checkRevocations as true. Use the same CANOPY_META_DB on data, control and auth.
# Release manifests can also be rendered with Helm.
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: canopy-data
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: canopy
      app.kubernetes.io/instance: canopy
      app.kubernetes.io/component: data
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: canopy-split
data:
  Caddyfile: |
    {
      admin off
    }

    {$CANOPY_SITE::8080} {
      @internal path /internal /internal/*
      handle @internal {
        respond "Not found" 404
      }

      handle /edge/healthz {
        respond "ok" 200
      }


      @auth path /auth/v1 /auth/v1/* /.well-known/jwks.json /admin/v1/users /admin/v1/users/*
      handle @auth {
        reverse_proxy {$CANOPY_AUTH_UPSTREAM:auth:8080}
      }

      @control path /admin/v1 /admin/v1/*
      handle @control {
        reverse_proxy {$CANOPY_CONTROL_UPSTREAM:control:8080}
      }

      @studio path /studio /studio/*
      handle @studio {
        reverse_proxy {$CANOPY_STUDIO_UPSTREAM:studio:8080}
      }

      handle {
        reverse_proxy {$CANOPY_DATA_UPSTREAM:data:8080} {
          flush_interval -1
        }
      }

      handle_errors 502 503 504 {
        header Content-Type "application/problem+json"
        header Retry-After "5"
        respond `{"type":"urn:canopy:error:unavailable","title":"Unavailable","status":503,"code":"CANOPY_UNAVAILABLE"}` 503
      }
    }

  gateway.json: |
    {
      "server": {
        "metricsHost": "0.0.0.0"
      },
      "wire": {
        "port": 27018
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: canopy-data
  labels:
    app.kubernetes.io/name: canopy
    app.kubernetes.io/instance: canopy
    app.kubernetes.io/component: data
spec:
  selector:
    app.kubernetes.io/name: canopy
    app.kubernetes.io/instance: canopy
    app.kubernetes.io/component: data
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: wire
      port: 27018
      targetPort: wire
---
apiVersion: v1
kind: Service
metadata:

# Canopy on Kubernetes without Helm: a Deployment of three canopy-server pods, a Service, a disruption budget
# and the policies as a ConfigMap. MongoDB is not part of it: point MONGODB_URI at a replica set (Atlas, the
# MongoDB operator, or your own). Build and push the image from deploy/docker/canopy.Dockerfile, then:
#
#   kubectl create secret generic canopy \
#     --from-literal=MONGODB_URI='mongodb://...' \
#     --from-literal=CANOPY_MASTER_KEY="$(openssl rand -base64 32)" \
#     --from-literal=CANOPY_PUBLISHABLE_KEYS="canopy_pk_$(openssl rand -hex 24)" \
#     --from-literal=CANOPY_SECRET_KEYS="canopy_sk_$(openssl rand -hex 24)" \
#     --from-literal=CANOPY_METRICS_TOKEN="$(openssl rand -hex 24)"
#   kubectl create configmap canopy-policies --from-file=policies/
#   kubectl apply -f deploy/kubernetes/canopy.yaml
#
# There are no default keys: the pods do not start until the secret exists. More keys can be created later
# in the meta database with `canopy keys create`. The drain window (CANOPY_DRAIN_WINDOW, 30 s) stays below the termination grace period
# (45 s), so connected clients are told to reconnect elsewhere before the pod is killed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canopy
  labels:
    app.kubernetes.io/name: canopy
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: canopy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: canopy
    spec:
      terminationGracePeriodSeconds: 45
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: canopy
          image: canopy:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9464
          env:
            - name: CANOPY_ENV
              value: production
            - name: CANOPY_DB
              value: app
            - name: CANOPY_POLICIES
              value: /app/policies
            - name: CANOPY_DRAIN_WINDOW
              value: 30s
            - name: CANOPY_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - secretRef:
                name: canopy
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          volumeMounts:
            - name: policies
              mountPath: /app/policies
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: policies
          configMap:
            name: canopy-policies
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: canopy
  labels:
    app.kubernetes.io/name: canopy
spec:
  selector:
    app.kubernetes.io/name: canopy
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: canopy-metrics
  labels:
    app.kubernetes.io/name: canopy
    app.kubernetes.io/component: metrics
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: canopy
  ports:
    - name: metrics
      port: 9464
      targetPort: metrics
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: canopy
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: canopy

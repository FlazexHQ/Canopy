{{- if not .Values.split.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "canopy.fullname" . }}
  labels:
    {{- include "canopy.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "canopy.selectorLabels" . | nindent 6 }}
{{- end }}

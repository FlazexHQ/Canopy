# Values of the Canopy chart. MongoDB is not part of the chart: set the URI of a replica set in the secret.

image:
  repository: canopy
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 3

# The app database and the environment. Production refuses development keys and needs a master key.
database: app
environment: production

# The secret with MONGODB_URI, CANOPY_MASTER_KEY, CANOPY_PUBLISHABLE_KEYS, CANOPY_SECRET_KEYS and, optionally,
# CANOPY_METRICS_TOKEN and the identity provider settings. The chart never creates keys: create the secret
# first (see NOTES.txt), or name one managed elsewhere.
existingSecret: canopy

# The name of a ConfigMap holding the policy files, mounted at /app/policies. Leave empty to read policies
# from the meta database instead (published with Studio or `canopy policies push`).
policiesConfigMap: canopy-policies

# How long connected clients get to move to another pod on shutdown. The termination grace period is this
# plus 15 seconds.
drainWindowSeconds: 30

# Extra environment variables, for example CANOPY_TRUSTED_PROXIES or CANOPY_CORS_ORIGINS.
env: {}

service:
  type: ClusterIP
  port: 80

metrics:
  # A headless Service on the metrics port for Prometheus. The pods bind 0.0.0.0, so keep the port inside the
  # cluster and set CANOPY_METRICS_TOKEN in the secret.
  enabled: true

podDisruptionBudget:
  maxUnavailable: 1

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    memory: 1Gi

nodeSelector: {}
tolerations: []
affinity: {}

# The split stack uses the same external MongoDB replica set as the default deployment.
# Publish policies with canopy policies push. The split deployments read the meta database.
split:
  enabled: false
  data:
    image: canopyd:latest
  control:
    replicaCount: 1
  studio:
    image: canopy-studio:latest
    replicaCount: 1
  edge:
    image: caddy:2.11.9@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b
    replicaCount: 2
  # Set to 0 to disable the MongoDB listener and Service port.
  wirePort: 27018
  # Set the public HTTPS URL without a trailing slash to enable built in auth.
  publicUrl: ""
  # Optional ConfigMap key canopy.config.ts for custom control settings.
  controlConfigMap: ""
  # Optional Secret key gateway.json for a complete gateway config, including any storage credentials.
  # This file replaces the generated gateway config. Include the built in auth settings if enabled
  # and keep the listener aligned with wirePort. Use S3 or R2, or provision storage for a local backend.
  gatewayConfigSecret: ""
  gatewayConfig:
    server:
      metricsHost: 0.0.0.0

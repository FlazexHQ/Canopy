name: canopy-chat
services:
  mongo:
    image: mongo:8.0.34@sha256:b9924c330a8bbc5800fe9c69f04a84e221eca7b28fd049a0354147d9908fa142
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - chat-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status() } catch { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) }; quit(db.hello().isWritablePrimary ? 0 : 1)"]
      interval: 3s
      timeout: 8s
      retries: 30
  canopy:
    build:
      context: ../..
      dockerfile: examples/chatapp/Dockerfile
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      CANOPY_MASTER_KEY: ${CANOPY_MASTER_KEY:?Generate a local .env file as described in README.md}
    volumes:
      - ./canopy.config.ts:/app/canopy.config.ts:ro
      - chat-files:/app/storage
      - ./policies:/app/policies:ro
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9464:9464"
    healthcheck:
      test: ["CMD", "bun", "-e", "process.exit((await fetch('http://localhost:8080/readyz')).ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 24
volumes:
  chat-data: {}
  chat-files: {}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="canopy-key" content="%PUBLISHABLE_KEY%" />
    <title>Canopy board</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      main {
        max-width: 40rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      form {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }
      input,
      select,
      button {
        font: inherit;
      }
      li {
        display: flex;
        gap: 0.5rem;
        align-items: baseline;
        padding: 0.25rem 0;
      }
      .topic {
        opacity: 0.7;
      }
      [role="alert"] {
        color: #b42318;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/app.js"></script>
  </body>
</html>

[package]
name = "s11-native-gateway"
description = "Spike S11: is a Rust realtime gateway worth it against the TypeScript engine at 10k and 50k connections?"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"
default-run = "gateway"

[workspace]

[[bin]]
name = "gateway"
path = "src/gateway/main.rs"

[[bin]]
name = "bench"
path = "src/bench/main.rs"

[dependencies]
base64 = "0.22"
bytes = "1"
canopy-matcher = { path = "../../../crates/canopy-matcher" }
canopy-policy = { path = "../../../crates/canopy-policy" }
canopy-protocol = { path = "../../../crates/canopy-protocol" }
canopy-query = { path = "../../../crates/canopy-query" }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
mongodb = { version = "=3.10.1", default-features = false, features = ["bson-3", "compat-3-3-0", "rustls-tls"] }
serde_json = "1"
socket2 = "0.6"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "io-std", "process", "signal"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[profile.release]
debug = 1

[package]
name = "canopy-native-s10"
description = "Spike S10: the Rust matcher behind Node-API, for Bun, Node and Deno, with a WebAssembly fallback."
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
canopy-matcher = { path = "../../../crates/canopy-matcher" }
canopy-protocol = { path = "../../../crates/canopy-protocol" }
napi = { version = "3.16.2", default-features = false, features = ["napi4"] }
napi-derive = "3.7.1"

[build-dependencies]
napi-build = "2.6.0"

[lints.rust]
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace]

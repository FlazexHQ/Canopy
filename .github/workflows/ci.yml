name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: 1.4.4
  # A quicker release profile for the addon CI tests. native-release.yml and the nightly benchmarks keep the
  # shipping profile of Cargo.toml (thin LTO, one codegen unit), so their caches use other keys.
  CARGO_PROFILE_RELEASE_LTO: "off"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  check:
    name: Lint, type check and test (Bun)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: ./.github/actions/canopy-js
      - run: bun install --frozen-lockfile
      - run: bunx biome ci .
      - run: bun fmt --check
      - name: Repository rules (workspace layout and dashes)
        run: bun tools/repo-check/src/cli.ts workspace dashes
      - name: Licenses of what the published packages install (MIT, Apache 2.0, BSD, ISC)
        run: bun packages/testing/scripts/licenses.ts
      - run: bun run typecheck
      - name: Unused exports
        run: bun run lint:exports
      - name: Every public export is documented
        run: bun run lint:docs
      - name: Package READMEs are up to date and every TypeScript snippet of the READMEs and docs compiles
        run: bun run lint:snippets
      - name: The committed public API files match the code
        run: bun run lint:api
      - run: bun --bun vitest run

  rust:
    name: Rust crates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - name: Restore the Cargo registry and build output
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-crates-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-crates-${{ runner.os }}-${{ runner.arch }}-
      - run: cargo fmt --all --check
      - name: The cargo fuzz targets, a workspace of their own, are formatted and compile
        run: |
          cargo fmt --manifest-path fuzz/Cargo.toml --check
          cargo check --locked --manifest-path fuzz/Cargo.toml
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit tests and the filter vectors recorded from MongoDB
        run: cargo test --locked
      - name: Save the Cargo registry and build output
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: Licenses, advisories, bans and sources of every crate (cargo deny)
        if: runner.os == 'Linux'
        env:
          DENY_VERSION: 0.20.2
          DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          archive="cargo-deny-$DENY_VERSION-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$DENY_VERSION/$archive"
          echo "$DENY_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" --strip-components=1
          "$RUNNER_TEMP/cargo-deny" --locked check

  native:
    name: Rust engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 for now: MongoDB 8 does not start on the kernel of ubuntu-24.04 runners (SERVER-121912).
        os: [ubuntu-22.04, windows-2025, macos-15]
    env:
      CANOPY_TEST_MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0
      CANOPY_REQUIRE_MONGODB: "1"
      SUITES: --project native --project matcher --project policy --project realtime --project rest --project graphql --project storage --project client --project server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain pinned in rust-toolchain.toml, with the WebAssembly target
        run: |
          rustup toolchain install
          rustup target add wasm32-wasip1-threads
      - name: Restore the Cargo registry and build output
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-native-nolto-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-native-nolto-${{ runner.os }}-${{ runner.arch }}-
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: ./.github/actions/canopy-js
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Build the addon of this platform, the WebAssembly fallback and the Workers and browser build
        run: |
          bun --filter @canopy/native build:native
          bun --filter @canopy/wasm build:native
      - name: Build the native gateway, which the realtime conformance suite and the DLS equivalence test run against
        run: cargo build --release --locked -p canopyd
      - name: Save the Cargo registry and build output
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - if: runner.os == 'Linux'
        name: Start a MongoDB 8.0 replica set in Docker
        run: docker compose -f deploy/compose/dev.yaml up -d --wait
        env:
          CANOPY_MONGO_IMAGE: mongo:8.0.34
      - if: runner.os != 'Linux'
        name: Restore the MongoDB 8.0.34 binaries (only the binaries, never the data)
        id: mongodb-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/mongodb/binaries/8.0.34
          key: mongodb-binaries-${{ runner.os }}-${{ runner.arch }}-8.0.34
      - if: runner.os != 'Linux'
        name: Start a MongoDB 8.0 replica set from the official binaries
        run: bun packages/testing/scripts/mongod.ts --version 8.0.34 --dir "${{ runner.temp }}/mongodb"
      - if: runner.os != 'Linux' && steps.mongodb-cache.outputs.cache-hit != 'true'
        name: Save the MongoDB 8.0.34 binaries
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/mongodb/binaries/8.0.34
          key: ${{ steps.mongodb-cache.outputs.cache-primary-key }}
      - name: The suites, the bypass corpus and the invariants on the native engine (Bun)
        shell: bash
        run: bun --bun vitest run $SUITES
        env:
          CANOPY_TEST_ENGINE: native
      - name: The suites, the bypass corpus and the invariants on the native engine (Node.js)
        shell: bash
        run: node node_modules/vitest/vitest.mjs run $SUITES
        env:
          CANOPY_TEST_ENGINE: native
      - name: The same on the WebAssembly fallback (Node.js)
        shell: bash
        run: node node_modules/vitest/vitest.mjs run $SUITES
        env:
          CANOPY_TEST_ENGINE: wasm
      - name: The standalone server embeds the addon and runs the native engine without node_modules
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          bun "$GITHUB_WORKSPACE/deploy/binary/build.ts" --only server --require-native --require-gateway --out "$RUNNER_TEMP/native-binary"
          exe=""
          if [ "$RUNNER_OS" = "Windows" ]; then exe=".exe"; fi
          mkdir native-smoke && cd native-smoke
          mkdir policies && cp "$GITHUB_WORKSPACE"/deploy/compose/policies/*.ts policies/
          MONGODB_URI="$CANOPY_TEST_MONGODB_URI" CANOPY_DB=native_binary CANOPY_POLICIES=policies \
            CANOPY_SECRET_KEYS=sk_ci PORT=18091 METRICS_PORT=19491 CANOPY_ENGINE=native \
            "$RUNNER_TEMP/native-binary/canopy-server$exe" > server.log 2>&1 &
          server=$!
          for attempt in $(seq 60); do
            if curl -fsS 127.0.0.1:18091/readyz; then break; fi
            sleep 1
          done
          grep -q '"engine":"native"' server.log || { cat server.log; exit 1; }
          curl -fsS -X POST 127.0.0.1:18091/rest/v1/notes -H "apikey: sk_ci" \
            -H "content-type: application/json" -d '{"ownerId":"user_1"}' || { cat server.log; exit 1; }
          bun "$GITHUB_WORKSPACE/deploy/binary/ws-smoke.ts" ws://127.0.0.1:18091/realtime/v1 sk_ci || { cat server.log; exit 1; }
          kill "$server"
      - if: failure() && runner.os != 'Linux'
        shell: bash
        run: grep -v '"ctx":"ftdc"' "$RUNNER_TEMP/mongodb/mongod.log" | tail -n 100 || true

  install:
    name: Install test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: ./.github/actions/canopy-js
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install the toolchain pinned in rust-toolchain.toml, with the WebAssembly target
        run: |
          rustup toolchain install
          rustup target add wasm32-wasip1-threads
      - name: Restore the Cargo registry and build output
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-native-nolto-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-native-nolto-${{ runner.os }}-${{ runner.arch }}-
      - run: bun install --frozen-lockfile
      - name: Build and pack the addon of this platform and the WebAssembly fallback, and build the Workers and browser build
        run: |
          bun --filter @canopy/native build:native --pack
          bun --filter @canopy/wasm build:native
      - name: Save the Cargo registry and build output
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: Pack every package, install the tarballs with Bun, npm, pnpm and Yarn, import every entry point, fall back to WebAssembly
        run: bun packages/testing/scripts/install-test.ts --build

  docs:
    name: Docs site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: ./.github/actions/canopy-js
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Build the docs site with the generated API reference
        run: bun --filter @canopy/docs build

  test-node:
    name: Test (Node.js ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: ./.github/actions/canopy-js
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: node --version
      - run: node node_modules/vitest/vitest.mjs run

  platforms:
    name: Test (${{ matrix.os }}, ${{ matrix.runtime == 'bun' && 'Bun' || format('Node.js {0}', matrix.runtime) }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
        runtime: [bun, "24", "26"]
    env:
      CANOPY_TEST_MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0
      CANOPY_REQUIRE_MONGODB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: ./.github/actions/canopy-js
      - if: matrix.runtime != 'bun'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.runtime }}
      - run: bun install --frozen-lockfile
      - name: Restore the MongoDB 8.0.34 binaries (only the binaries, never the data)
        id: mongodb-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/mongodb/binaries/8.0.34
          key: mongodb-binaries-${{ runner.os }}-${{ runner.arch }}-8.0.34
      - name: Start a MongoDB 8.0 replica set from the official binaries
        run: bun packages/testing/scripts/mongod.ts --version 8.0.34 --dir "${{ runner.temp }}/mongodb"
      - if: steps.mongodb-cache.outputs.cache-hit != 'true'
        name: Save the MongoDB 8.0.34 binaries
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/mongodb/binaries/8.0.34
          key: ${{ steps.mongodb-cache.outputs.cache-primary-key }}
      - name: Let the canopy dev --with-mongo test run the same mongod
        shell: bash
        run: echo "CANOPY_TEST_MONGOD=$(ls "${{ runner.temp }}"/mongodb/binaries/8.0.34/mongodb-*/bin/mongod* | head -n 1)" >> "$GITHUB_ENV"
      - if: matrix.runtime == 'bun'
        name: Unit, integration and differential tests (Bun)
        run: bun --bun vitest run
      - if: matrix.runtime != 'bun'
        name: Unit, integration and differential tests (Node.js)
        run: node node_modules/vitest/vitest.mjs run
      - if: matrix.runtime == 'bun'
        name: Build the native gateway
        run: |
          rustup toolchain install
          cargo build --release --locked -p canopyd
      - if: matrix.runtime == 'bun'
        name: The standalone executables run without node_modules
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          bun "$GITHUB_WORKSPACE/deploy/binary/build.ts" --require-gateway --out "$RUNNER_TEMP/binaries"
          exe=""
          if [ "$RUNNER_OS" = "Windows" ]; then exe=".exe"; fi
          mkdir policies && cp "$GITHUB_WORKSPACE"/deploy/compose/policies/*.ts policies/
          "binaries/canopy$exe" --version
          "binaries/canopy$exe" policies lint --dir policies
          MONGODB_URI="$CANOPY_TEST_MONGODB_URI" CANOPY_DB=binary CANOPY_POLICIES=policies \
            CANOPY_SECRET_KEYS=sk_ci PORT=18090 METRICS_PORT=19490 \
            "binaries/canopy-server$exe" > server.log 2>&1 &
          server=$!
          for attempt in $(seq 60); do
            if curl -fsS 127.0.0.1:18090/readyz; then break; fi
            sleep 1
          done
          curl -fsS -X POST 127.0.0.1:18090/rest/v1/notes -H "apikey: sk_ci" \
            -H "content-type: application/json" -d '{"ownerId":"user_1"}' || { cat server.log; exit 1; }
          bun "$GITHUB_WORKSPACE/deploy/binary/ws-smoke.ts" ws://127.0.0.1:18090/realtime/v1 sk_ci || { cat server.log; exit 1; }
          if [ "$RUNNER_OS" = "Windows" ]; then
            kill "$server"
          else
            kill -TERM "$server"
            wait "$server"
            grep -q '"msg":"stopped"' server.log || { cat server.log; exit 1; }
          fi
      - if: failure()
        shell: bash
        run: grep -v '"ctx":"ftdc"' "$RUNNER_TEMP/mongodb/mongod.log" | tail -n 100 || true

  mongo:
    name: MongoDB ${{ matrix.mongo }} replica set (${{ matrix.runtime }})
    # Temporary: MongoDB 8 refuses to start on the 7.0.0 kernel of ubuntu-24.04 runners (SERVER-121912); move back once they ship 7.0.14 or newer.
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mongo: ["8.0.34", "9.0.8"]
        runtime: [node, bun]
    env:
      CANOPY_MONGO_IMAGE: mongo:${{ matrix.mongo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose -f deploy/compose/dev.yaml up -d --wait
      - run: docker compose -f deploy/compose/dev.yaml exec -T mongo mongosh --quiet --file /canopy/mongo-smoke.js
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: ./.github/actions/canopy-js
      # On both legs, so the Bun leg keeps the Node.js 24 it ran next to before the split.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - if: matrix.runtime == 'node'
        name: Integration and differential tests (Node, with coverage)
        run: node node_modules/vitest/vitest.mjs run --coverage --testTimeout=60000
        env:
          CANOPY_TEST_MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0
          CANOPY_REQUIRE_MONGODB: "1"
      - if: matrix.runtime == 'bun'
        name: Integration and differential tests (Bun)
        run: bun --bun vitest run
        env:
          CANOPY_TEST_MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0
          CANOPY_REQUIRE_MONGODB: "1"
      - if: failure()
        run: docker compose -f deploy/compose/dev.yaml logs mongo
      - if: always()
        run: docker compose -f deploy/compose/dev.yaml down --volumes

  e2e:
    name: Browser end to end tests (todo-react, auth-notes, graphql-vue and next-ssr, Playwright)
    # Temporary: MongoDB 8 refuses to start on the 7.0.0 kernel of ubuntu-24.04 runners (SERVER-121912); move back once they ship 7.0.14 or newer.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose -f deploy/compose/dev.yaml up -d --wait
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: ./.github/actions/canopy-js
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - name: Install Chromium
        working-directory: examples/todo-react
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Multi tab, multi user and offline tests
        working-directory: examples/todo-react
        run: node node_modules/@playwright/test/cli.js test
        env:
          CANOPY_TEST_MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0
      - name: Sign up, sign in and private live notes (auth-notes)
        working-directory: examples/auth-notes
        run: node node_modules/@playwright/test/cli.js test
        env:
          CANOPY_TEST_MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0
      - name: GraphQL queries, mutations and live Vue updates (graphql-vue)
        working-directory: examples/graphql-vue
        run: node node_modules/@playwright/test/cli.js test
        env:
          CANOPY_TEST_MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0
      - name: Build the packages Next.js consumes
        run: bun run build
      - name: Server rendering and hydration with Next.js (next-ssr)
        working-directory: examples/next-ssr
        run: node node_modules/@playwright/test/cli.js test
        env:
          CANOPY_TEST_MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0
      - if: always()
        run: docker compose -f deploy/compose/dev.yaml down --volumes

  studio-e2e:
    name: Studio end to end tests (canopy-server, Playwright)
    # Temporary: MongoDB 8 refuses to start on the 7.0.0 kernel of ubuntu-24.04 runners (SERVER-121912); move back once they ship 7.0.14 or newer.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose -f deploy/compose/dev.yaml up -d --wait
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: ./.github/actions/canopy-js
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - name: Build Studio
        run: bun --filter @canopy/studio-app build
      - name: Install Chromium
        working-directory: apps/studio
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Critical flows and CSP checks
        working-directory: apps/studio
        run: node node_modules/@playwright/test/cli.js test
        env:
          CANOPY_TEST_MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: studio-e2e-traces
          path: apps/studio/test-results
          retention-days: 7
      - if: always()
        run: docker compose -f deploy/compose/dev.yaml down --volumes

  images:
    name: Docker images and compose stack
    # Temporary: MongoDB 8 refuses to start on the 7.0.0 kernel of ubuntu-24.04 runners (SERVER-121912); move back once they ship 7.0.14 or newer.
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: ./.github/actions/canopy-js
      - name: Build the standalone gateway image
        run: docker build -f deploy/docker/canopyd.Dockerfile -t canopyd:ci .
      - name: Build the control plane image
        run: docker build -f deploy/docker/canopy-control.Dockerfile --build-context canopyjs=../Canopy.js -t canopy-control:ci .
      - name: Build the canopy-realtime sidecar image
        run: docker build -f deploy/docker/canopy-realtime.Dockerfile --build-context canopyjs=../Canopy.js -t canopy-realtime:ci .
      - name: Build the canopy and Studio images and start the stack of separate services
        run: docker compose -f deploy/compose/canopy.yaml up -d --build --wait --wait-timeout 240
        env:
          CANOPY_IMAGE: canopy:ci
          CANOPY_STUDIO_IMAGE: canopy-studio:ci
      - name: Smoke test the stack, then the native gateway as the realtime service
        env:
          CANOPY_IMAGE: canopy:ci
          CANOPY_STUDIO_IMAGE: canopy-studio:ci
        run: |
          deploy/compose/canopy-smoke.sh
          export CANOPY_REALTIME_SERVER=gateway
          docker compose -f deploy/compose/canopy.yaml up -d --no-build --wait --wait-timeout 180 api realtime
          docker compose -f deploy/compose/canopy.yaml logs realtime | grep '"realtimeServer":"gateway"'
          bun deploy/binary/ws-smoke.ts ws://127.0.0.1:8080/realtime/v1 sk_dev_change_me
          deploy/compose/canopy-smoke.sh
      - name: Smoke test the split stack with the control plane stopped
        env: &split-env
          CANOPY_CONTROL_IMAGE: canopy-control:ci
          CANOPY_GATEWAY_IMAGE: canopyd:ci
          CANOPY_STUDIO_IMAGE: canopy-studio:ci
          CANOPY_PORT: "28080"
          CANOPY_MONGO_PORT: "37017"
          CANOPY_WIRE_PORT: "37018"
          CANOPY_METRICS_PORT: "29464"
          CANOPY_CONTROL_METRICS_PORT: "29465"
          CANOPY_SPLIT_E2E_URL: http://localhost:28080
          CANOPY_TEST_MONGODB_URI: mongodb://localhost:37017/?replicaSet=rs0&directConnection=true
          CANOPY_PUBLISHABLE_KEYS: pk,pk_rest_reader,pk_rest_writes,pk_client_auth,pk_todo_e2e
          CANOPY_SECRET_KEYS: sk_split_e2e
          CANOPY_MASTER_KEY: split-stack-ci-master-key-0123456789abcdef
          COMPOSE_FILE: ${{ github.workspace }}/deploy/compose/split.yaml:${{ github.workspace }}/deploy/compose/split-auth.yaml:${{ github.workspace }}/deploy/compose/split-e2e.yaml
        run: bun deploy/compose/split-smoke.ts --no-build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - name: Install Chromium
        working-directory: examples/todo-react
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Start the split stack with built in auth
        env: *split-env
        run: CANOPY_PUBLISH_POLICIES=off docker compose up -d --no-build --wait --wait-timeout 240
      - name: Run Studio through the split edge
        env: *split-env
        run: |
          token="$(docker compose logs --no-color control | grep -oE 'canopy_setup_[A-Za-z0-9_-]+' | tail -n 1)"
          test -n "$token"
          cd apps/studio
          STUDIO_E2E_SETUP_TOKEN="$token" node node_modules/@playwright/test/cli.js test
      - name: Run SDK auth through the split edge
        if: success() || failure()
        env: *split-env
        run: |
          export CANOPY_PUBLISH_POLICIES=off CANOPY_CONTROL_CONFIG=./split-e2e-control.ts
          docker compose up -d --no-build --wait --wait-timeout 120 control
          bun run test:all --project sdk-e2e test/auth.e2e.test.ts
      - name: Run SDK data and realtime through the split edge
        if: success() || failure()
        env: *split-env
        run: |
          export COMPOSE_FILE=deploy/compose/split.yaml:deploy/compose/split-e2e.yaml
          export CANOPY_DB=sdk_split_e2e CANOPY_META_DB=sdk_split_meta
          export CANOPY_GATEWAY_CONFIG="$RUNNER_TEMP/split-e2e-gateway.json"
          bun -e '
            import { generateKeyPairSync } from "node:crypto"
            const { privateKey, publicKey } = generateKeyPairSync("ed25519")
            const jwk = { ...publicKey.export({ format: "jwk" }), kid: "dev", alg: "EdDSA" }
            await Bun.write(process.env.CANOPY_GATEWAY_CONFIG, JSON.stringify({
              server: { metricsHost: "0.0.0.0" },
              realtime: { checkpoints: "off" },
              rateLimits: false,
              auth: {
                issuer: "https://todo-react.example/dev-issuer",
                audience: "https://todo-react.example/api",
                jwks: { keys: [jwk] }
              }
            }))
            const value = JSON.stringify(privateKey.export({ format: "jwk" }))
            console.log("::add-mask::" + value)
            await Bun.write(process.env.RUNNER_TEMP + "/split-issuer-key", value)
          '
          export TODO_DEV_ISSUER_KEY="$(cat "$RUNNER_TEMP/split-issuer-key")"
          docker compose up -d --no-build --wait --wait-timeout 120 data
          bun run test:all --project sdk-e2e --maxWorkers 1 \
            test/e2e.test.ts test/rest.e2e.test.ts test/rest-writes.e2e.test.ts \
            test/mutations.e2e.test.ts test/offline.e2e.test.ts test/fallback.e2e.test.ts
      - name: Run todo-react through the split edge
        if: success() || failure()
        env: *split-env
        run: |
          export COMPOSE_FILE=deploy/compose/split.yaml:deploy/compose/split-e2e.yaml
          export CANOPY_DB=todo_split_e2e CANOPY_META_DB=todo_split_meta
          export CANOPY_GATEWAY_CONFIG="$RUNNER_TEMP/split-e2e-gateway.json"
          export TODO_DEV_ISSUER_KEY="$(cat "$RUNNER_TEMP/split-issuer-key")"
          bun --conditions=@canopy/source examples/todo-react/e2e/seed-split.ts
          docker compose up -d --no-build --wait --wait-timeout 120 data
          cd examples/todo-react
          node node_modules/@playwright/test/cli.js test
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: split-e2e-traces
          path: |
            apps/studio/test-results
            examples/todo-react/test-results
          retention-days: 7
      - if: failure()
        env: *split-env
        run: docker compose logs --tail 100
      - if: always()
        env: *split-env
        run: docker compose down --volumes
      - name: The sidecar and gateway images start and report ready
        run: |
          docker run -d --name sidecar --network canopy_default -p 127.0.0.1:18080:8080 \
            -e MONGODB_URI="mongodb://database:27017/?replicaSet=rs0" -e CANOPY_DB=app \
            -e CANOPY_PUBLISHABLE_KEYS=pk_dev -v "$PWD/deploy/compose/policies:/app/policies:ro" \
            canopy-realtime:ci
          docker run -d --read-only --name sidecar-gateway --network canopy_default -p 127.0.0.1:18081:8080 \
            -e MONGODB_URI="mongodb://database:27017/?replicaSet=rs0" -e CANOPY_DB=app \
            -e CANOPY_PUBLISHABLE_KEYS=pk_dev -v "$PWD/deploy/compose/policies:/app/policies:ro" \
            -e CANOPY_NODE_ID=sidecar-gateway -e CANOPY_REALTIME_SERVER=gateway canopy-realtime:ci
          docker run -d --read-only --name gateway --network canopy_default \
            -p 127.0.0.1:18082:8080 -p 127.0.0.1:19464:9464 \
            -e MONGODB_URI="mongodb://database:27017/?replicaSet=rs0" -e CANOPY_DB=app \
            -e CANOPY_NODE_ID=gateway -e CANOPY_PUBLISHABLE_KEYS=pk_dev canopyd:ci

          check_ready() {
            for ((attempt = 0; attempt < 60; attempt++)); do
              if curl -fsS --max-time 2 "http://127.0.0.1:$2/readyz"; then return 0; fi
              sleep 1
            done
            docker logs "$1"
            return 1
          }
          check_ready sidecar 18080
          check_ready sidecar-gateway 18081
          check_ready gateway 18082
          curl -fsS --max-time 2 http://127.0.0.1:19464/metrics
      - run: bun install --frozen-lockfile
      - name: Build the standalone executables
        run: |
          rustup toolchain install
          cargo build --release --locked -p canopyd
          bun deploy/binary/build.ts --target linux-x64 --require-gateway --out "$RUNNER_TEMP/binaries"
      - name: The executables run without node_modules
        working-directory: ${{ runner.temp }}
        run: |
          mkdir policies && cp "$GITHUB_WORKSPACE"/deploy/compose/policies/*.ts policies/
          binaries/canopy-linux-x64 --version
          binaries/canopy-linux-x64 policies lint --dir policies
          smoke() (
            export MONGODB_URI="mongodb://localhost:27017/?directConnection=true" CANOPY_DB=binary
            export CANOPY_POLICIES=policies CANOPY_SECRET_KEYS=sk_ci PORT=18090 METRICS_PORT=19490
            binaries/canopy-server-linux-x64 > server.log 2>&1 &
            server=$!
            trap 'status=$?; kill -TERM "$server" 2>/dev/null || true; wait "$server" || true; if [ "$status" -ne 0 ]; then cat server.log; fi' EXIT
            curl -fsS --max-time 2 --retry 60 --retry-delay 1 --retry-connrefused http://127.0.0.1:18090/readyz
            curl -fsS -X POST http://127.0.0.1:18090/rest/v1/notes -H "apikey: sk_ci" \
              -H "content-type: application/json" -d '{"ownerId":"user_1"}'
            bun "$GITHUB_WORKSPACE/deploy/binary/ws-smoke.ts" ws://127.0.0.1:18090/realtime/v1 sk_ci
            kill -TERM "$server"
            wait "$server"
            trap '' EXIT
            grep -q '"msg":"stopped"' server.log || { cat server.log; exit 1; }
            if [ "${CANOPY_REALTIME_SERVER:-}" = gateway ]; then
              grep -q '"realtimeServer":"gateway"' server.log || { cat server.log; exit 1; }
            fi
          )
          smoke
          CANOPY_REALTIME_SERVER=gateway smoke
      - if: failure()
        run: docker compose -f deploy/compose/canopy.yaml logs
      - if: always()
        run: |
          docker rm -f sidecar sidecar-gateway gateway || true
          docker compose -f deploy/compose/canopy.yaml down --volumes

  changeset:
    name: Changeset present
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: ./.github/actions/canopy-js
      - run: bun install --frozen-lockfile
      - run: bunx changeset status --since=origin/${{ github.base_ref }}

  commit-rules:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: ./.github/actions/canopy-js
      - run: bun install --frozen-lockfile
      - name: Conventional Commits, sign off and dashes
        run: |
          for sha in $(git rev-list --no-merges "origin/${{ github.base_ref }}..HEAD"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/message"
            bun tools/repo-check/src/cli.ts commit-msg "$RUNNER_TEMP/message"
          done

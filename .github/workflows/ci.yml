name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: 1.4.4

jobs:
  check:
    name: Lint, type check and test (Bun)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bunx biome ci .
      - run: bun run typecheck
      - name: Unused exports
        run: bun run lint:exports
      - name: Every public export is documented
        run: bun run lint:docs
      - name: Bundle size budgets
        run: bunx size-limit
      - run: bun --bun vitest run

  docs:
    name: Docs site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Build the docs site with the generated API reference
        run: bun --filter @canopy/docs build

  test-node:
    name: Test (Node.js ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: node --version
      - run: node node_modules/vitest/vitest.mjs run

  platforms:
    name: Test (${{ matrix.os }}, ${{ matrix.runtime == 'bun' && 'Bun' || format('Node.js {0}', matrix.runtime) }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
        runtime: [bun, "24", "26"]
    env:
      CANOPY_TEST_MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0
      CANOPY_REQUIRE_MONGODB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - if: matrix.runtime != 'bun'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.runtime }}
      - run: bun install --frozen-lockfile
      - name: Start a MongoDB 8.0 replica set from the official binaries
        run: bun packages/testing/scripts/mongod.ts --version 8.0.34 --dir "${{ runner.temp }}/mongodb"
      - if: matrix.runtime == 'bun'
        run: bunx biome ci .
      - if: matrix.runtime == 'bun'
        run: bun run typecheck
      - if: matrix.runtime == 'bun'
        name: Unit, integration and differential tests (Bun)
        run: bun --bun vitest run
      - if: matrix.runtime != 'bun'
        name: Unit, integration and differential tests (Node.js)
        run: node node_modules/vitest/vitest.mjs run
      - if: matrix.runtime == 'bun'
        name: The standalone executables run without node_modules
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          bun "$GITHUB_WORKSPACE/deploy/binary/build.ts" --out "$RUNNER_TEMP/binaries"
          exe=""
          if [ "$RUNNER_OS" = "Windows" ]; then exe=".exe"; fi
          mkdir policies && cp "$GITHUB_WORKSPACE"/deploy/compose/policies/*.ts policies/
          "binaries/canopy$exe" policies lint --dir policies
          MONGODB_URI="$CANOPY_TEST_MONGODB_URI" CANOPY_DB=binary CANOPY_POLICIES=policies \
            CANOPY_SECRET_KEYS=sk_ci PORT=18090 METRICS_PORT=19490 \
            "binaries/canopy-server$exe" > server.log 2>&1 &
          server=$!
          for attempt in $(seq 60); do
            if curl -fsS 127.0.0.1:18090/readyz; then break; fi
            sleep 1
          done
          curl -fsS -X POST 127.0.0.1:18090/rest/v1/notes -H "apikey: sk_ci" \
            -H "content-type: application/json" -d '{"ownerId":"user_1"}' || { cat server.log; exit 1; }
          if [ "$RUNNER_OS" = "Windows" ]; then
            kill "$server"
          else
            kill -TERM "$server"
            wait "$server"
            grep -q '"msg":"stopped"' server.log || { cat server.log; exit 1; }
          fi
      - if: failure()
        shell: bash
        run: grep -v '"ctx":"ftdc"' "$RUNNER_TEMP/mongodb/mongod.log" | tail -n 100 || true

  mongo:
    name: MongoDB ${{ matrix.mongo }} replica set
    # Temporary: MongoDB 8 refuses to start on the 7.0.0 kernel of ubuntu-24.04 runners (SERVER-121912); move back once they ship 7.0.14 or newer.
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mongo: ["7.0.45", "8.0.34"]
    env:
      CANOPY_MONGO_IMAGE: mongo:${{ matrix.mongo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose -f deploy/compose/dev.yaml up -d --wait
      - run: docker compose -f deploy/compose/dev.yaml exec -T mongo mongosh --quiet --file /canopy/mongo-smoke.js
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - name: Integration and differential tests (Node, with coverage on MongoDB 8.0)
        run: node node_modules/vitest/vitest.mjs run ${{ matrix.mongo == '8.0.34' && '--coverage --testTimeout=60000' || '' }}
        env:
          CANOPY_TEST_MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0
          CANOPY_REQUIRE_MONGODB: "1"
      - name: Integration and differential tests (Bun)
        run: bun --bun vitest run
        env:
          CANOPY_TEST_MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0
          CANOPY_REQUIRE_MONGODB: "1"
      - if: failure()
        run: docker compose -f deploy/compose/dev.yaml logs mongo
      - if: always()
        run: docker compose -f deploy/compose/dev.yaml down --volumes

  e2e:
    name: Browser end to end tests (todo-react, Playwright)
    # Temporary: MongoDB 8 refuses to start on the 7.0.0 kernel of ubuntu-24.04 runners (SERVER-121912); move back once they ship 7.0.14 or newer.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose -f deploy/compose/dev.yaml up -d --wait
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - name: Install Chromium
        working-directory: examples/todo-react
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Multi tab, multi user and offline tests
        working-directory: examples/todo-react
        run: node node_modules/@playwright/test/cli.js test
        env:
          CANOPY_TEST_MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0
      - if: always()
        run: docker compose -f deploy/compose/dev.yaml down --volumes

  studio-e2e:
    name: Studio end to end tests (canopy-server, Playwright)
    # Temporary: MongoDB 8 refuses to start on the 7.0.0 kernel of ubuntu-24.04 runners (SERVER-121912); move back once they ship 7.0.14 or newer.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose -f deploy/compose/dev.yaml up -d --wait
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - name: Build Studio
        run: bun --filter @canopy/studio-app build
      - name: Install Chromium
        working-directory: apps/studio
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Critical flows and CSP checks
        working-directory: apps/studio
        run: node node_modules/@playwright/test/cli.js test
        env:
          CANOPY_TEST_MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: studio-e2e-traces
          path: apps/studio/test-results
          retention-days: 7
      - if: always()
        run: docker compose -f deploy/compose/dev.yaml down --volumes

  images:
    name: Docker images and compose stack
    # Temporary: MongoDB 8 refuses to start on the 7.0.0 kernel of ubuntu-24.04 runners (SERVER-121912); move back once they ship 7.0.14 or newer.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the canopy-realtime sidecar image
        run: docker build -f deploy/docker/canopy-realtime.Dockerfile -t canopy-realtime:ci .
      - name: Build the canopy image and start the compose stack
        run: docker compose -f deploy/compose/canopy.yaml up -d --build --wait --wait-timeout 180
        env:
          CANOPY_IMAGE: canopy:ci
      - name: Smoke test the compose stack
        run: deploy/compose/canopy-smoke.sh
      - name: The sidecar image starts and reports ready
        run: |
          docker run -d --name sidecar --network canopy_default -p 18080:8080 \
            -e MONGODB_URI="mongodb://mongo:27017/?replicaSet=rs0" -e CANOPY_DB=app \
            -e CANOPY_PUBLISHABLE_KEYS=pk_dev -v "$PWD/deploy/compose/policies:/app/policies:ro" \
            canopy-realtime:ci
          for attempt in $(seq 60); do
            if curl -fsS localhost:18080/readyz; then exit 0; fi
            sleep 1
          done
          docker logs sidecar
          exit 1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Build the standalone executables
        run: bun deploy/binary/build.ts --target linux-x64 --out "$RUNNER_TEMP/binaries"
      - name: The executables run without node_modules
        working-directory: ${{ runner.temp }}
        run: |
          mkdir policies && cp "$GITHUB_WORKSPACE"/deploy/compose/policies/*.ts policies/
          binaries/canopy-linux-x64 policies lint --dir policies
          MONGODB_URI="mongodb://localhost:27017/?directConnection=true" CANOPY_DB=binary \
            CANOPY_POLICIES=policies CANOPY_SECRET_KEYS=sk_ci PORT=18090 METRICS_PORT=19490 \
            binaries/canopy-server-linux-x64 > server.log 2>&1 &
          for attempt in $(seq 60); do
            if curl -fsS localhost:18090/readyz; then break; fi
            sleep 1
          done
          curl -fsS -X POST localhost:18090/rest/v1/notes -H "apikey: sk_ci" \
            -H "content-type: application/json" -d '{"ownerId":"user_1"}'
          kill -TERM %1
          wait %1
          grep -q '"msg":"stopped"' server.log || { cat server.log; exit 1; }
      - if: failure()
        run: docker compose -f deploy/compose/canopy.yaml logs
      - if: always()
        run: |
          docker rm -f sidecar || true
          docker compose -f deploy/compose/canopy.yaml down --volumes

  changeset:
    name: Changeset present
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bunx changeset status --since=origin/${{ github.base_ref }}

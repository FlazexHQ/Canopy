name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: 1.4.4

jobs:
  check:
    name: Lint, type check and test (Bun)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bunx biome ci .
      - name: Repository rules (workspace layout and dashes)
        run: bun tools/repo-check/src/cli.ts workspace dashes
      - name: Licenses of what the published packages install (MIT, Apache 2.0, BSD, ISC)
        run: bun packages/testing/scripts/licenses.ts
      - run: bun run typecheck
      - name: Unused exports
        run: bun run lint:exports
      - name: Every public export is documented
        run: bun run lint:docs
      - name: Package READMEs are up to date and every TypeScript snippet of the READMEs and docs compiles
        run: bun run lint:snippets
      - name: The committed public API files match the code
        run: bun run lint:api
      - run: bun --bun vitest run

  rust:
    name: Rust crates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit tests and the filter vectors recorded from MongoDB
        run: cargo test --locked
      - name: Licenses, advisories, bans and sources of every crate (cargo deny)
        if: runner.os == 'Linux'
        env:
          DENY_VERSION: 0.20.2
          DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          archive="cargo-deny-$DENY_VERSION-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$DENY_VERSION/$archive"
          echo "$DENY_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" --strip-components=1
          "$RUNNER_TEMP/cargo-deny" --locked check

  native:
    name: Rust engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 for now: MongoDB 8 does not start on the kernel of ubuntu-24.04 runners (SERVER-121912).
        os: [ubuntu-22.04, windows-2025, macos-15]
    env:
      CANOPY_TEST_MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0
      CANOPY_REQUIRE_MONGODB: "1"
      SUITES: --project native --project policy --project realtime --project rest --project graphql --project storage --project client --project server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain pinned in rust-toolchain.toml, with the WebAssembly target
        run: |
          rustup toolchain install
          rustup target add wasm32-wasip1-threads
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Build the addon of this platform and the WebAssembly fallback
        run: bun --filter @canopy/native build:native
      - if: runner.os == 'Linux'
        name: Start a MongoDB 8.0 replica set in Docker
        run: docker compose -f deploy/compose/dev.yaml up -d --wait
        env:
          CANOPY_MONGO_IMAGE: mongo:8.0.34
      - if: runner.os != 'Linux'
        name: Start a MongoDB 8.0 replica set from the official binaries
        run: bun packages/testing/scripts/mongod.ts --version 8.0.34 --dir "${{ runner.temp }}/mongodb"
      - name: The suites, the bypass corpus and the invariants on the native engine (Bun)
        shell: bash
        run: bun --bun vitest run $SUITES
        env:
          CANOPY_TEST_ENGINE: native
      - name: The suites, the bypass corpus and the invariants on the native engine (Node.js)
        shell: bash
        run: node node_modules/vitest/vitest.mjs run $SUITES
        env:
          CANOPY_TEST_ENGINE: native
      - name: The same on the WebAssembly fallback (Node.js)
        shell: bash
        run: node node_modules/vitest/vitest.mjs run $SUITES
        env:
          CANOPY_TEST_ENGINE: wasm
      - name: The standalone server embeds the addon and runs the native engine without node_modules
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          bun "$GITHUB_WORKSPACE/deploy/binary/build.ts" --only server --require-native --out "$RUNNER_TEMP/native-binary"
          exe=""
          if [ "$RUNNER_OS" = "Windows" ]; then exe=".exe"; fi
          mkdir native-smoke && cd native-smoke
          mkdir policies && cp "$GITHUB_WORKSPACE"/deploy/compose/policies/*.ts policies/
          MONGODB_URI="$CANOPY_TEST_MONGODB_URI" CANOPY_DB=native_binary CANOPY_POLICIES=policies \
            CANOPY_SECRET_KEYS=sk_ci PORT=18091 METRICS_PORT=19491 CANOPY_ENGINE=native \
            "$RUNNER_TEMP/native-binary/canopy-server$exe" > server.log 2>&1 &
          server=$!
          for attempt in $(seq 60); do
            if curl -fsS 127.0.0.1:18091/readyz; then break; fi
            sleep 1
          done
          grep -q '"engine":"native"' server.log || { cat server.log; exit 1; }
          curl -fsS -X POST 127.0.0.1:18091/rest/v1/notes -H "apikey: sk_ci" \
            -H "content-type: application/json" -d '{"ownerId":"user_1"}' || { cat server.log; exit 1; }
          bun "$GITHUB_WORKSPACE/deploy/binary/ws-smoke.ts" ws://127.0.0.1:18091/realtime/v1 sk_ci || { cat server.log; exit 1; }
          kill "$server"
      - if: failure() && runner.os != 'Linux'
        shell: bash
        run: grep -v '"ctx":"ftdc"' "$RUNNER_TEMP/mongodb/mongod.log" | tail -n 100 || true

  install:
    name: Install test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install the toolchain pinned in rust-toolchain.toml, with the WebAssembly target
        run: |
          rustup toolchain install
          rustup target add wasm32-wasip1-threads
      - run: bun install --frozen-lockfile
      - name: Build and pack the addon of this platform and the WebAssembly fallback
        run: bun --filter @canopy/native build:native --pack
      - name: Pack every package, install the tarballs with Bun, npm, pnpm and Yarn, import every entry point, fall back to WebAssembly
        run: bun packages/testing/scripts/install-test.ts --build

  docs:
    name: Docs site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Build the docs site with the generated API reference
        run: bun --filter @canopy/docs build

  test-node:
    name: Test (Node.js ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: node --version
      - run: node node_modules/vitest/vitest.mjs run

  platforms:
    name: Test (${{ matrix.os }}, ${{ matrix.runtime == 'bun' && 'Bun' || format('Node.js {0}', matrix.runtime) }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
        runtime: [bun, "24", "26"]
    env:
      CANOPY_TEST_MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0
      CANOPY_REQUIRE_MONGODB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - if: matrix.runtime != 'bun'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.runtime }}
      - run: bun install --frozen-lockfile
      - name: Start a MongoDB 8.0 replica set from the official binaries
        run: bun packages/testing/scripts/mongod.ts --version 8.0.34 --dir "${{ runner.temp }}/mongodb"
      - name: Let the canopy dev --with-mongo test run the same mongod
        shell: bash
        run: echo "CANOPY_TEST_MONGOD=$(ls "${{ runner.temp }}"/mongodb/mongodb-*/bin/mongod* | head -n 1)" >> "$GITHUB_ENV"
      - if: matrix.runtime == 'bun'
        run: bunx biome ci .
      - if: matrix.runtime == 'bun'
        run: bun run typecheck
      - if: matrix.runtime == 'bun'
        name: Unit, integration and differential tests (Bun)
        run: bun --bun vitest run
      - if: matrix.runtime != 'bun'
        name: Unit, integration and differential tests (Node.js)
        run: node node_modules/vitest/vitest.mjs run
      - if: matrix.runtime == 'bun'
        name: The standalone executables run without node_modules
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          bun "$GITHUB_WORKSPACE/deploy/binary/build.ts" --out "$RUNNER_TEMP/binaries"
          exe=""
          if [ "$RUNNER_OS" = "Windows" ]; then exe=".exe"; fi
          mkdir policies && cp "$GITHUB_WORKSPACE"/deploy/compose/policies/*.ts policies/
          "binaries/canopy$exe" --version
          "binaries/canopy$exe" policies lint --dir policies
          MONGODB_URI="$CANOPY_TEST_MONGODB_URI" CANOPY_DB=binary CANOPY_POLICIES=policies \
            CANOPY_SECRET_KEYS=sk_ci PORT=18090 METRICS_PORT=19490 \
            "binaries/canopy-server$exe" > server.log 2>&1 &
          server=$!
          for attempt in $(seq 60); do
            if curl -fsS 127.0.0.1:18090/readyz; then break; fi
            sleep 1
          done
          curl -fsS -X POST 127.0.0.1:18090/rest/v1/notes -H "apikey: sk_ci" \
            -H "content-type: application/json" -d '{"ownerId":"user_1"}' || { cat server.log; exit 1; }
          bun "$GITHUB_WORKSPACE/deploy/binary/ws-smoke.ts" ws://127.0.0.1:18090/realtime/v1 sk_ci || { cat server.log; exit 1; }
          if [ "$RUNNER_OS" = "Windows" ]; then
            kill "$server"
          else
            kill -TERM "$server"
            wait "$server"
            grep -q '"msg":"stopped"' server.log || { cat server.log; exit 1; }
          fi
      - if: failure()
        shell: bash
        run: grep -v '"ctx":"ftdc"' "$RUNNER_TEMP/mongodb/mongod.log" | tail -n 100 || true

  mongo:
    name: MongoDB ${{ matrix.mongo }} replica set
    # Temporary: MongoDB 8 refuses to start on the 7.0.0 kernel of ubuntu-24.04 runners (SERVER-121912); move back once they ship 7.0.14 or newer.
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mongo: ["7.0.45", "8.0.34"]
    env:
      CANOPY_MONGO_IMAGE: mongo:${{ matrix.mongo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose -f deploy/compose/dev.yaml up -d --wait
      - run: docker compose -f deploy/compose/dev.yaml exec -T mongo mongosh --quiet --file /canopy/mongo-smoke.js
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - name: Integration and differential tests (Node, with coverage on MongoDB 8.0)
        run: node node_modules/vitest/vitest.mjs run ${{ matrix.mongo == '8.0.34' && '--coverage --testTimeout=60000' || '' }}
        env:
          CANOPY_TEST_MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0
          CANOPY_REQUIRE_MONGODB: "1"
      - name: Integration and differential tests (Bun)
        run: bun --bun vitest run
        env:
          CANOPY_TEST_MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0
          CANOPY_REQUIRE_MONGODB: "1"
      - if: failure()
        run: docker compose -f deploy/compose/dev.yaml logs mongo
      - if: always()
        run: docker compose -f deploy/compose/dev.yaml down --volumes

  e2e:
    name: Browser end to end tests (todo-react, auth-notes, graphql-vue and next-ssr, Playwright)
    # Temporary: MongoDB 8 refuses to start on the 7.0.0 kernel of ubuntu-24.04 runners (SERVER-121912); move back once they ship 7.0.14 or newer.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose -f deploy/compose/dev.yaml up -d --wait
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - name: Install Chromium
        working-directory: examples/todo-react
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Multi tab, multi user and offline tests
        working-directory: examples/todo-react
        run: node node_modules/@playwright/test/cli.js test
        env:
          CANOPY_TEST_MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0
      - name: Sign up, sign in and private live notes (auth-notes)
        working-directory: examples/auth-notes
        run: node node_modules/@playwright/test/cli.js test
        env:
          CANOPY_TEST_MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0
      - name: GraphQL queries, mutations and live Vue updates (graphql-vue)
        working-directory: examples/graphql-vue
        run: node node_modules/@playwright/test/cli.js test
        env:
          CANOPY_TEST_MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0
      - name: Build the packages Next.js consumes
        run: bun run build
      - name: Server rendering and hydration with Next.js (next-ssr)
        working-directory: examples/next-ssr
        run: node node_modules/@playwright/test/cli.js test
        env:
          CANOPY_TEST_MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0
      - if: always()
        run: docker compose -f deploy/compose/dev.yaml down --volumes

  studio-e2e:
    name: Studio end to end tests (canopy-server, Playwright)
    # Temporary: MongoDB 8 refuses to start on the 7.0.0 kernel of ubuntu-24.04 runners (SERVER-121912); move back once they ship 7.0.14 or newer.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose -f deploy/compose/dev.yaml up -d --wait
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - name: Build Studio
        run: bun --filter @canopy/studio-app build
      - name: Install Chromium
        working-directory: apps/studio
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Critical flows and CSP checks
        working-directory: apps/studio
        run: node node_modules/@playwright/test/cli.js test
        env:
          CANOPY_TEST_MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: studio-e2e-traces
          path: apps/studio/test-results
          retention-days: 7
      - if: always()
        run: docker compose -f deploy/compose/dev.yaml down --volumes

  images:
    name: Docker images and compose stack
    # Temporary: MongoDB 8 refuses to start on the 7.0.0 kernel of ubuntu-24.04 runners (SERVER-121912); move back once they ship 7.0.14 or newer.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the canopy-realtime sidecar image
        run: docker build -f deploy/docker/canopy-realtime.Dockerfile -t canopy-realtime:ci .
      - name: Build the canopy image and start the compose stack
        run: docker compose -f deploy/compose/canopy.yaml up -d --build --wait --wait-timeout 180
        env:
          CANOPY_IMAGE: canopy:ci
      - name: Smoke test the compose stack
        run: deploy/compose/canopy-smoke.sh
      - name: The sidecar image starts and reports ready
        run: |
          docker run -d --name sidecar --network canopy_default -p 18080:8080 \
            -e MONGODB_URI="mongodb://mongo:27017/?replicaSet=rs0" -e CANOPY_DB=app \
            -e CANOPY_PUBLISHABLE_KEYS=pk_dev -v "$PWD/deploy/compose/policies:/app/policies:ro" \
            canopy-realtime:ci
          for attempt in $(seq 60); do
            if curl -fsS localhost:18080/readyz; then exit 0; fi
            sleep 1
          done
          docker logs sidecar
          exit 1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Build the standalone executables
        run: bun deploy/binary/build.ts --target linux-x64 --out "$RUNNER_TEMP/binaries"
      - name: The executables run without node_modules
        working-directory: ${{ runner.temp }}
        run: |
          mkdir policies && cp "$GITHUB_WORKSPACE"/deploy/compose/policies/*.ts policies/
          binaries/canopy-linux-x64 --version
          binaries/canopy-linux-x64 policies lint --dir policies
          MONGODB_URI="mongodb://localhost:27017/?directConnection=true" CANOPY_DB=binary \
            CANOPY_POLICIES=policies CANOPY_SECRET_KEYS=sk_ci PORT=18090 METRICS_PORT=19490 \
            binaries/canopy-server-linux-x64 > server.log 2>&1 &
          for attempt in $(seq 60); do
            if curl -fsS localhost:18090/readyz; then break; fi
            sleep 1
          done
          curl -fsS -X POST localhost:18090/rest/v1/notes -H "apikey: sk_ci" \
            -H "content-type: application/json" -d '{"ownerId":"user_1"}'
          bun "$GITHUB_WORKSPACE/deploy/binary/ws-smoke.ts" ws://127.0.0.1:18090/realtime/v1 sk_ci
          kill -TERM %1
          wait %1
          grep -q '"msg":"stopped"' server.log || { cat server.log; exit 1; }
      - if: failure()
        run: docker compose -f deploy/compose/canopy.yaml logs
      - if: always()
        run: |
          docker rm -f sidecar || true
          docker compose -f deploy/compose/canopy.yaml down --volumes

  changeset:
    name: Changeset present
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bunx changeset status --since=origin/${{ github.base_ref }}

  commit-rules:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Conventional Commits, sign off and dashes
        run: |
          for sha in $(git rev-list --no-merges "origin/${{ github.base_ref }}..HEAD"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/message"
            bun tools/repo-check/src/cli.ts commit-msg "$RUNNER_TEMP/message"
          done

name: Full benchmark

# Temporary: runs every benchmark at its default size on Linux, once per push to this branch.
on:
  push:
    branches: [bench/full-linux]

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.4
  CANOPY_MONGO_IMAGE: mongo:8.0.34
  CANOPY_BENCH_MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0

jobs:
  scale:
    name: REST scale (10k, 100k and 1M documents, ingest)
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: docker compose -f deploy/compose/dev.yaml up -d --wait
      - run: bun install --frozen-lockfile
      - name: Scale benchmark at every tier, 3 alternating rounds
        working-directory: packages/rest
        env:
          CANOPY_BENCH_OUT: ${{ github.workspace }}/scale.json
        run: npm run bench:scale
      - name: Compare with the baseline (reported only)
        if: ${{ !cancelled() }}
        continue-on-error: true
        working-directory: packages/rest
        run: npm run bench:check -- "$GITHUB_WORKSPACE/scale.json"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-scale
          path: scale.json
          if-no-files-found: ignore

  write-cost:
    name: Write path cost (open loop, 500, 1000 and 2000 writes/s)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: docker compose -f deploy/compose/dev.yaml up -d --wait
      - run: bun install --frozen-lockfile
      - name: Write path cost at each rate
        working-directory: packages/rest
        shell: bash
        run: |
          for rate in 500 1000 2000; do
            CANOPY_BENCH_RATE="$rate" node --conditions=@canopy/source bench/write-cost.ts --json > "$GITHUB_WORKSPACE/write-cost-$rate.json"
          done
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-write-cost
          path: write-cost-*.json
          if-no-files-found: ignore

  matcher:
    name: Matcher (TypeScript, Rust addon and WebAssembly)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install the toolchain pinned in rust-toolchain.toml, with the WebAssembly target
        shell: bash
        run: |
          rustup toolchain install
          rustup target add wasm32-wasip1-threads
      - name: Restore the Cargo registry and build output
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-native-${{ runner.os }}-${{ runner.arch }}-
      - run: bun install --frozen-lockfile
      - name: Build the addon and the WebAssembly fallback (release)
        run: bun --filter @canopy/native build:native
      - name: Matcher throughput against hand written predicates, 1M documents, 3 runs
        working-directory: packages/matcher
        shell: bash
        run: |
          for run in 1 2 3; do
            CANOPY_BENCH_OUT="$GITHUB_WORKSPACE/matcher-$run.json" npm run bench
          done
      - name: Matcher per change event on each engine, 200k events, 3 runs
        if: ${{ !cancelled() }}
        working-directory: packages/matcher
        shell: bash
        env:
          CANOPY_BENCH_WASM_EVENTS: "200000"
        run: |
          for run in 1 2 3; do
            CANOPY_BENCH_OUT="$GITHUB_WORKSPACE/events-$run.json" npm run bench:events
          done
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-matcher
          path: |
            matcher-*.json
            events-*.json
          if-no-files-found: ignore

  fanout:
    name: Realtime fan out (1M documents, every scenario, each engine)
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install the toolchain pinned in rust-toolchain.toml, with the WebAssembly target
        shell: bash
        run: |
          rustup toolchain install
          rustup target add wasm32-wasip1-threads
      - name: Restore the Cargo registry and build output
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-native-${{ runner.os }}-${{ runner.arch }}-
      - run: docker compose -f deploy/compose/dev.yaml up -d --wait
      - run: bun install --frozen-lockfile
      - name: Build the addon and the WebAssembly fallback (release)
        run: bun --filter @canopy/native build:native
      - name: Fan out on the TypeScript and Rust engines, alternating, 2 runs each
        working-directory: packages/realtime
        shell: bash
        run: |
          for run in 1 2; do
            for engine in ts native; do
              CANOPY_TEST_ENGINE="$engine" CANOPY_BENCH_OUT="$GITHUB_WORKSPACE/fanout-$engine-$run.json" npm run bench
            done
          done
      - name: Fan out on the WebAssembly engine, 1 run
        if: ${{ !cancelled() }}
        continue-on-error: true
        working-directory: packages/realtime
        env:
          CANOPY_TEST_ENGINE: wasm
        run: CANOPY_BENCH_OUT="$GITHUB_WORKSPACE/fanout-wasm-1.json" npm run bench
        shell: bash
      - name: Compare the engines
        if: ${{ !cancelled() }}
        working-directory: packages/realtime
        shell: bash
        run: npm run bench:compare -- "$GITHUB_WORKSPACE"/fanout-*-*.json --out "$GITHUB_WORKSPACE/fanout-compare.json"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-fanout
          path: fanout-*.json
          if-no-files-found: ignore

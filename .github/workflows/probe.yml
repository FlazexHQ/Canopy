name: Probe
on:
  push:
    branches: [ci/cross-platform]
jobs:
  kernel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04, ubuntu-24.04-arm, windows-2025, windows-11-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - run: uname -a
        shell: bash
      - run: docker run --rm mongo:8.0.34 mongod --version
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
      - run: docker run --rm mongo:8.0.34 mongod --dbpath /tmp --replSet rs0 & sleep 8; docker ps -a
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash

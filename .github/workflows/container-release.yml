name: Container release

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    name: Build and push images (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, os: ubuntu-24.04 }
          - { arch: arm64, os: ubuntu-24.04-arm }
    env:
      ARCH: ${{ matrix.arch }}
      REGISTRY_OWNER: ${{ github.repository_owner }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
        with:
          cosign-release: v3.1.4
      - name: Sign in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build, attest and sign the images for this architecture
        run: |
          mkdir image-digests
          for image in canopy-gateway canopy-realtime canopy; do
            repo="ghcr.io/${REGISTRY_OWNER,,}/$image"
            metadata="$RUNNER_TEMP/$image.json"
            docker buildx build --platform "linux/$ARCH" -f "deploy/docker/$image.Dockerfile" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "org.opencontainers.image.version=$RELEASE_TAG" \
              --sbom=true --provenance=true --push --metadata-file "$metadata" \
              -t "$repo:$RELEASE_TAG-$ARCH" .
            digest=$(jq -er '."containerimage.digest"' "$metadata")
            ref="$repo@$digest"
            manifest=$(docker buildx imagetools inspect --raw "$ref" | jq -er --arg arch "$ARCH" \
              '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest')
            cosign sign --yes "$repo@$manifest" "$ref"
            printf '%s\n' "$ref" > "image-digests/$image"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digests-${{ matrix.arch }}
          path: image-digests
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Publish the release tags
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      REGISTRY_OWNER: ${{ github.repository_owner }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
        with:
          cosign-release: v3.1.4
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-digests-*
          path: image-digests
      - name: Sign in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish and sign the combined image manifests
        run: |
          for image in canopy-gateway canopy-realtime canopy; do
            repo="ghcr.io/${REGISTRY_OWNER,,}/$image"
            metadata="$RUNNER_TEMP/$image.json"
            docker buildx imagetools create --metadata-file "$metadata" -t "$repo:$RELEASE_TAG" \
              "$(cat "image-digests/image-digests-amd64/$image")" \
              "$(cat "image-digests/image-digests-arm64/$image")"
            digest=$(jq -er '."containerimage.descriptor".digest' "$metadata")
            cosign sign --yes "$repo@$digest"
          done

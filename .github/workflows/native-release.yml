name: Native release builds

# Builds every platform package of @canopy/native on its own runner, assembles the release (the nine platform
# packages and the root package naming them all), checks it, installs it with every package manager and loads
# each addon where the hardware exists. It assembles the checked tarballs as the native-release artifact.
# Each Rust target gets an archive containing the gateway and CLI. Both binaries also ship
# in one npm package per platform (@canopy/canopyd-<suffix>) plus the @canopy/realtime tarball
# whose optionalDependencies name them all, plus one shared Studio package, as the canopyd-npm-release artifact.
on:
  pull_request:
    paths:
      - "crates/**"
      - "apps/studio/**"
      - "bun.lock"
      - "conformance/**"
      - "packages/native/**"
      - "packages/wasm/**"
      - "packages/realtime/package.json"
      - "packages/realtime/scripts/**"
      - "packages/realtime/src/gateway-package.ts"
      - "packages/realtime/src/gateway.ts"
      - "packages/realtime/test/canopyd-packages.test.ts"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "deploy/binary/**"
      - "packages/testing/scripts/install-test.ts"
      - "packages/testing/scripts/publish-tarballs.ts"
      - "packages/testing/test/publish-tarballs.test.ts"
      - "packages/testing/scripts/licenses.ts"
      - ".github/workflows/native-release.yml"
  schedule:
    - cron: "0 3 * * *"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the assembled tarballs to npm
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: 1.4.4

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04, bun: linux-x64, wasm: true }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04, bun: linux-x64-musl }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04, bun: linux-arm64 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04, bun: linux-arm64-musl }
          - { target: x86_64-pc-windows-msvc, os: windows-2025, bun: windows-x64 }
          - { target: aarch64-pc-windows-msvc, os: windows-2025, bun: windows-arm64 }
          - { target: x86_64-apple-darwin, os: macos-15, bun: darwin-x64 }
          - { target: aarch64-apple-darwin, os: macos-15, bun: darwin-arm64 }
    env:
      RUST_TARGET: ${{ matrix.target }}
      BUN_TARGET: ${{ matrix.bun }}
      SIGN_RELEASE: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain pinned in rust-toolchain.toml with the targets of this runner
        shell: bash
        run: |
          rustup toolchain install
          rustup target add "$RUST_TARGET" ${{ matrix.wasm && 'wasm32-wasip1-threads' || '' }}
      - name: Restore the Cargo registry and build output
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-release-${{ matrix.target }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-release-${{ matrix.target }}-${{ runner.arch }}-
      - if: runner.os == 'Linux'
        name: Install Zig and cargo-zigbuild from PyPI, pinned by hash
        run: |
          cat > "$RUNNER_TEMP/zigbuild.txt" <<'EOF'
          cargo-zigbuild==0.24.1 --hash=sha256:238a1ab54a95053a4eadc34775c81f795a8ad75f80bfed63f3f445f518102375
          ziglang==0.17.0.post0 --hash=sha256:c9528d6a2cdf56a701bb8cafbc9967f59d88ecc8bb42b87ec2f9693418f69ce3
          EOF
          python3 -m venv "$RUNNER_TEMP/zigbuild"
          "$RUNNER_TEMP/zigbuild/bin/pip" install --quiet --only-binary :all: --require-hashes -r "$RUNNER_TEMP/zigbuild.txt"
          echo "$RUNNER_TEMP/zigbuild/bin" >> "$GITHUB_PATH"
      - if: runner.os == 'Linux'
        run: cargo-zigbuild --version && python3 -m ziglang version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: ./.github/actions/canopy-js
      - run: bun install --frozen-lockfile
      - name: Build, pack and check the packages of this runner
        shell: bash
        run: |
          bun packages/native/scripts/build.ts --target "$RUST_TARGET" --pack \
            ${{ runner.os == 'Linux' && '--cross' || '' }} ${{ !matrix.wasm && '--native-only' || '' }}
      - if: env.SIGN_RELEASE == 'true'
        name: Generate CycloneDX SBOMs for the gateway and CLI
        shell: bash
        run: |
          cargo install -j 2 --locked --version 0.5.10 cargo-cyclonedx
          cargo cyclonedx --target "$RUST_TARGET" --format json --spec-version 1.6
      - name: Build and archive the gateway and CLI
        shell: bash
        run: |
          case "$RUST_TARGET" in
            *-linux-musl)
              RUSTFLAGS="-C target-feature=+crt-static" cargo zigbuild -j 2 --release --locked -p canopyd -p canopy-cli --target "$RUST_TARGET"
              for binary in canopyd canopy; do
                headers=$(readelf -l -d "target/$RUST_TARGET/release/$binary")
                if grep -E 'INTERP|NEEDED' <<< "$headers"; then
                  echo "$binary must be statically linked on musl" >&2
                  exit 1
                fi
              done
              ;;
            *-linux-gnu)
              cargo zigbuild -j 2 --release --locked -p canopyd -p canopy-cli --target "$RUST_TARGET.2.17"
              ;;
            *)
              cargo build -j 2 --release --locked -p canopyd -p canopy-cli --target "$RUST_TARGET"
              ;;
          esac

          staging="$RUNNER_TEMP/gateway-archive"
          mkdir gateway-pack "$staging"
          suffix=
          if [[ "$RUNNER_OS" == Windows ]]; then suffix=.exe; fi
          members=("canopyd$suffix" "canopy$suffix")
          for binary in "${members[@]}"; do
            cp "target/$RUST_TARGET/release/$binary" "$staging/"
          done
          if [[ "$SIGN_RELEASE" == true ]]; then
            cp crates/canopyd/canopyd.cdx.json "$staging/canopyd.cdx.json"
            cp crates/canopy-cli/canopy-cli.cdx.json "$staging/canopy.cdx.json"
            members+=(canopyd.cdx.json canopy.cdx.json)
          fi
          archive="$PWD/gateway-pack/canopyd-$RUST_TARGET"
          cd "$staging"
          if [[ "$RUNNER_OS" == Windows ]]; then
            archive="$archive.zip"
            python -m zipfile -c "$archive" "${members[@]}"
          else
            archive="$archive.tar.gz"
            tar -czf "$archive" "${members[@]}"
          fi
          cd "$(dirname "$archive")"
          archive="$(basename "$archive")"
          if [[ "$RUNNER_OS" == macOS ]]; then
            shasum -a 256 "$archive" > "$archive.sha256"
          else
            sha256sum "$archive" > "$archive.sha256"
          fi
      - name: Pack and check both executables in the npm package of this platform
        shell: bash
        run: |
          suffix=
          if [[ "$RUNNER_OS" == Windows ]]; then suffix=.exe; fi
          bun packages/realtime/scripts/pack-canopyd.ts --target "$RUST_TARGET" \
            --binary "target/$RUST_TARGET/release/canopyd$suffix" \
            --cli-binary "target/$RUST_TARGET/release/canopy$suffix" ${{ runner.os == 'Linux' && '--glibc-baseline' || '' }}
      - if: env.SIGN_RELEASE == 'true'
        name: Build standalone executables with the native addon and gateway
        shell: bash
        run: |
          bun deploy/binary/build.ts --target "$BUN_TARGET" --require-native --require-gateway --out "$RUNNER_TEMP/standalone"
          mkdir standalone-pack
          archive="$PWD/standalone-pack/canopy-standalone-$RUST_TARGET"
          cd "$RUNNER_TEMP/standalone"
          if [[ "$RUNNER_OS" == Windows ]]; then
            python -m zipfile -c "$archive.zip" *.exe SHA256SUMS
          else
            tar -czf "$archive.tar.gz" "canopy-$BUN_TARGET" "canopy-server-$BUN_TARGET" canopyd SHA256SUMS
          fi
      - if: env.SIGN_RELEASE == 'true'
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
        with:
          cosign-release: v3.1.4
      - if: env.SIGN_RELEASE == 'true'
        name: Sign the gateway and standalone archives
        shell: bash
        run: |
          suffix=tar.gz
          if [[ "$RUNNER_OS" == Windows ]]; then suffix=zip; fi
          for archive in "gateway-pack/canopyd-$RUST_TARGET.$suffix" "standalone-pack/canopy-standalone-$RUST_TARGET.$suffix"; do
            cosign sign-blob --yes --bundle "$archive.sigstore.json" "$archive"
          done
      - name: Save the Cargo registry and build output
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-packs-${{ matrix.target }}
          path: packages/native/packs
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canopyd-${{ matrix.target }}
          path: gateway-pack
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canopyd-packs-${{ matrix.target }}
          path: packages/realtime/packs
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - if: env.SIGN_RELEASE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canopy-standalone-${{ matrix.target }}
          path: standalone-pack
          if-no-files-found: error
          compression-level: 0

  assemble:
    name: Assemble, check licenses and install with every package manager
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: ./.github/actions/canopy-js
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-packs-*
          path: ${{ runner.temp }}/native-packs
      - name: Assemble the release from all nine platform packages and check every tarball
        run: bun packages/native/scripts/build.ts --assemble "$RUNNER_TEMP/native-packs"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: canopyd-packs-*
          path: ${{ runner.temp }}/canopyd-packs
      - name: Build Studio and its third party notices
        working-directory: apps/studio
        run: bun --bun run build --outDir "$RUNNER_TEMP/studio-assets"
      - name: Assemble and check the canopyd packages, Studio assets and realtime launcher
        run: bun packages/realtime/scripts/pack-canopyd.ts --assemble "$RUNNER_TEMP/canopyd-packs" --studio-dir "$RUNNER_TEMP/studio-assets"
      - name: Licenses of what the published packages install, the WebAssembly package included
        run: bun packages/testing/scripts/licenses.ts
      - name: Build the browser and Workers WebAssembly package before packing it
        run: |
          rustup toolchain install
          bun --filter @canopy/wasm build:native
      - name: Install and check the addon, WebAssembly fallback, gateway and CLI across package managers
        run: bun packages/testing/scripts/install-test.ts --build --canopyd-packs packages/realtime/packs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-release
          path: packages/native/packs
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canopyd-npm-release
          path: packages/realtime/packs
          if-no-files-found: error
          compression-level: 0

  smoke:
    name: Smoke test the released addon, gateway and CLI (${{ matrix.target }})
    needs: assemble
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, musl: x86_64-unknown-linux-musl, os: ubuntu-24.04 }
          - {
              target: aarch64-unknown-linux-gnu,
              musl: aarch64-unknown-linux-musl,
              os: ubuntu-24.04-arm,
            }
          - { target: x86_64-pc-windows-msvc, os: windows-2025 }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-release
          path: packages/native/packs
      - name: Load the addon of this runner from its tarball
        run: node packages/native/scripts/smoke.ts packages/native/packs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canopyd-npm-release
          path: packages/realtime/packs
      - name: Run the installed gateway and CLI and serve the installed Studio assets
        run: node packages/realtime/scripts/smoke-canopyd.ts packages/realtime/packs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canopyd-${{ matrix.target }}
          path: gateway-pack
      - name: Verify and run the gateway from its archive
        shell: bash
        working-directory: gateway-pack
        env:
          ARCHIVE_PREFIX: canopyd-${{ matrix.target }}
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            sha256sum -c "$ARCHIVE_PREFIX.zip.sha256"
            unzip "$ARCHIVE_PREFIX.zip"
            ./canopyd.exe --help
          else
            if [[ "$RUNNER_OS" == macOS ]]; then
              shasum -a 256 -c "$ARCHIVE_PREFIX.tar.gz.sha256"
            else
              sha256sum -c "$ARCHIVE_PREFIX.tar.gz.sha256"
            fi
            tar -xzf "$ARCHIVE_PREFIX.tar.gz"
            ./canopyd --help
          fi
      - if: matrix.musl
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canopyd-${{ matrix.musl }}
          path: gateway-musl-pack
      - if: matrix.musl
        name: Load the musl addon and run the musl gateway and CLI on Alpine Linux
        env:
          ARCHIVE: canopyd-${{ matrix.musl }}.tar.gz
        run: |
          (cd gateway-musl-pack && sha256sum -c "$ARCHIVE.sha256" && tar -xzf "$ARCHIVE")
          docker run --rm -v "$PWD:/repo:ro" -w /repo node:24-alpine@sha256:116b800c3754b440ee0aa3ed2f20f5bf3d99a554bfd9adeea09ea8017f6e85f5 \
            sh -ec 'node packages/native/scripts/smoke.ts packages/native/packs && ./gateway-musl-pack/canopyd --help && node packages/realtime/scripts/smoke-canopyd.ts packages/realtime/packs'

  publish-dry-run:
    name: Dry run the npm release
    if: github.event_name != 'release' && (github.event_name != 'workflow_dispatch' || !inputs.publish)
    needs: [assemble, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - &release-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &release-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - &release-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - &release-native-tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-release
          path: ${{ runner.temp }}/native-release
      - &release-canopyd-tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canopyd-npm-release
          path: ${{ runner.temp }}/canopyd-npm-release
      - name: Check licenses and dry run every tarball
        run: bun packages/testing/scripts/publish-tarballs.ts "$RUNNER_TEMP/native-release" "$RUNNER_TEMP/canopyd-npm-release"

  publish:
    name: Publish the assembled npm release
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: [assemble, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    concurrency: npm-native-release
    permissions:
      id-token: write
      contents: read
    steps:
      - *release-checkout
      - *release-bun
      - *release-node
      - *release-native-tarballs
      - *release-canopyd-tarballs
      - name: Require licenses and publish every unpublished tarball
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun packages/testing/scripts/publish-tarballs.ts --publish "$RUNNER_TEMP/native-release" "$RUNNER_TEMP/canopyd-npm-release"

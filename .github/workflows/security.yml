name: Security

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # BlueOak-1.0.0 is allowed for development tooling only (minimatch under Stryker); the
          # licenses step of the CI check job keeps what published packages install to the stricter set.
          allow-licenses: MIT, MIT-0, Apache-2.0, BSD-2-Clause, BSD-3-Clause, 0BSD, ISC, CC0-1.0, BlueOak-1.0.0
          # unicode-ident (MIT or Apache 2.0, and Unicode 3.0 for its data tables) runs inside procedural macros
          # only. The remaining Unicode and certificate data crates match the gateway exceptions in
          # deny.toml. libfuzzer-sys is confined to the separate fuzz workspace. zlib-rs is listed in
          # Cargo.lock only as a weak optional dependency of flate2 that nothing enables, so it is never built.
          allow-dependencies-licenses: >-
            pkg:cargo/icu_collections,
            pkg:cargo/icu_locale_core,
            pkg:cargo/icu_normalizer,
            pkg:cargo/icu_normalizer_data,
            pkg:cargo/icu_properties,
            pkg:cargo/icu_properties_data,
            pkg:cargo/icu_provider,
            pkg:cargo/libfuzzer-sys,
            pkg:cargo/zlib-rs,
            pkg:cargo/litemap,
            pkg:cargo/potential_utf,
            pkg:cargo/tinystr,
            pkg:cargo/unicode-ident,
            pkg:cargo/unicode-normalization,
            pkg:cargo/unicode-properties,
            pkg:cargo/webpki-root-certs,
            pkg:cargo/webpki-roots,
            pkg:cargo/writeable,
            pkg:cargo/yoke,
            pkg:cargo/yoke-derive,
            pkg:cargo/zerofrom,
            pkg:cargo/zerofrom-derive,
            pkg:cargo/zerotrie,
            pkg:cargo/zerovec,
            pkg:cargo/zerovec-derive
          comment-summary-in-pr: never

  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript, actions
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: codeql

  secrets:
    name: Secret scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@3bd2b5887eb0efb8fa18bfd1d296032924e4ffdc # v3.99.9
        with:
          # Recorded test fixtures hold signed test tokens, never real credentials.
          extra_args: --results=verified,unknown --exclude-paths=.github/trufflehog-exclude.txt

name: Feature request
description: Propose an improvement or a new capability.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Changes to the wire protocol, the policy language, the public client API or deployment modes need an RFC.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

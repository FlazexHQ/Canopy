[workspace]
resolver = "3"
members = ["crates/*", "packages/native", "packages/wasm"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false
repository = "https://github.com/FlazexHQ/Canopy"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

# Password hashing runs at full speed in tests too: the admin oracle replay hashes dozens of passwords.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

[profile.dev.package.bcrypt]
opt-level = 3

[profile.dev.package.blowfish]
opt-level = 3

[profile.dev.package.'pbkdf2:0.13.0']
opt-level = 3

[workspace]
resolver = "3"
members = ["crates/*", "packages/native"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false
repository = "https://github.com/FlazexHQ/Canopy"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

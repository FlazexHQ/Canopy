[install]
linker = "isolated"
exact = true
minimumReleaseAge = 604800
# ui-sdk is newer than the release age window; Studio pins its exact beta in the catalog.
minimumReleaseAgeExcludes = ["@ui-sdk/core", "@ui-sdk/react"]

[fmt]
printWidth = 100
semi = false
ignorePatterns = ["docs/**", "bench/spikes/**", "api/**", "conformance/matcher/**", "conformance/query/**", "conformance/policy/**", "conformance/http/**", "conformance/http/admin/**", "conformance/http/studio/**", "conformance/http/storage/**", "conformance/cursor/**", "conformance/auth/**", "conformance/webhooks/**", "conformance/migrations/**", "conformance/typegen/**", "conformance/schema/schema.json", "conformance/graphql/schema.json", ".changeset/*.md", "apps/docs/src/content/**", "**/routeTree.gen.ts", "deploy/helm/*/templates/**", "**/.next/**", "**/next-env.d.ts", ".canopy/**", "target/**", "**/dist/**", "packages/studio/app/**", "**/canopyd.json", "**/*.toml"]

[package]
name = "canopy-auth"
description = "Canopy's verification of API keys, JWTs and Studio view tokens with session revocation checks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.22"
canopy-engine = { path = "../canopy-engine" }
canopy-mongo = { path = "../canopy-mongo" }
canopy-policy = { path = "../canopy-policy" }
canopy-protocol = { path = "../canopy-protocol" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
ring = "0.17"
tokio = { version = "1", features = ["sync", "time"] }

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["rt"] }

[lints]
workspace = true

[package]
name = "canopy-schema"
description = "Collection schema inference and shape operations over BSON values."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
canopy-policy = { path = "../canopy-policy" }
canopy-protocol = { path = "../canopy-protocol" }
regex = "1"

[dev-dependencies]
mongodb = { version = "=3.10.1", default-features = false, features = ["bson-3", "compat-3-3-0", "dns-resolver", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true

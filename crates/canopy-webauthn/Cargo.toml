[package]
name = "canopy-webauthn"
description = "Canopy's WebAuthn relying party: strict CBOR, COSE and authenticator data parsing, and the registration and authentication ceremonies on ring."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
base64ct = { version = "1.8", features = ["alloc"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
serde_json = "1"

[lints]
workspace = true

[package]
name = "canopy-webhooks"
description = "Canopy's durable webhook triggers, schedules and delivery worker."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
base64ct = { version = "1.8", features = ["alloc"] }
bson = { version = "3", features = ["serde_json-1"] }
canopy-engine = { path = "../canopy-engine" }
canopy-matcher = { path = "../canopy-matcher" }
canopy-mongo = { path = "../canopy-mongo" }
canopy-protocol = { path = "../canopy-protocol" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
httpdate = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["net", "rt-multi-thread"] }

[lints]
workspace = true

[package]
name = "canopy-authn"
description = "Canopy built in authentication routes and primitives."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
canopy-http = { path = "../canopy-http" }
canopy-mail = { path = "../canopy-mail" }
canopy-mongo = { path = "../canopy-mongo" }
canopy-protocol = { path = "../canopy-protocol" }
canopy-webauthn = { path = "../canopy-webauthn" }
canopy-webhooks = { path = "../canopy-webhooks" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
url = "2"
aes = "0.8"
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
base64ct = { version = "1.8", features = ["alloc"] }
bcrypt = { version = "0.19.3", default-features = false, features = ["zeroize"] }
bson = { version = "3", features = ["serde_json-1"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
ctr = "0.9"
getrandom = "0.4"
hex = "0.4"
http = "1"
httpdate = "1"
pbkdf2 = "0.13"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
ring = "0.17"
scrypt = { version = "0.11", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_bytes = { version = "0.2", features = ["preserve_order"] }
sha1 = "0.11"
sha2 = "0.11"
subtle = "2"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[dev-dependencies]
regex = "1"
percent-encoding = "2"
canopy-auth = { path = "../canopy-auth" }
proptest = { version = "1.11", default-features = false, features = ["std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["net", "io-util"] }

[lints]
workspace = true

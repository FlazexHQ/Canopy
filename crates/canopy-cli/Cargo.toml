[package]
name = "canopy-cli"
description = "The Canopy command line interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "canopy"
path = "src/main.rs"

[dependencies]
canopy-control = { path = "../canopy-control" }
canopy-migrations = { path = "../canopy-migrations" }
canopy-mongo = { path = "../canopy-mongo" }
canopy-protocol = { path = "../canopy-protocol" }
indexmap = { version = "2", features = ["serde"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
rpassword = "=7.4.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde_json = "1"
strsim = "0.11"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["macros", "rt"] }
url = "2"

[dev-dependencies]
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bson = { version = "3", features = ["serde_json-1"] }
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true

[package]
name = "canopy-storage"
description = "Canopy's file storage in the data plane: objects described in storage.objects under the storage policies, their contents in a backend, signed URLs and resumable uploads."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.22"
canopy-data = { path = "../canopy-data" }
canopy-http = { path = "../canopy-http" }
canopy-mongo = { path = "../canopy-mongo" }
canopy-policy = { path = "../canopy-policy" }
canopy-protocol = { path = "../canopy-protocol" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
image = { version = "=0.25.9", default-features = false, features = ["avif", "bmp", "gif", "jpeg", "png", "webp"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["fs", "io-util", "rt", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
canopy-auth = { path = "../canopy-auth" }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }

[lints]
workspace = true

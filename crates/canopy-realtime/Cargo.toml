[package]
name = "canopy-realtime"
description = "Canopy's native realtime session routing, transports and MongoDB change stream ingestion."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.22"
canopy-auth = { path = "../canopy-auth" }
canopy-engine = { path = "../canopy-engine" }
canopy-mongo = { path = "../canopy-mongo" }
canopy-policy = { path = "../canopy-policy" }
canopy-protocol = { path = "../canopy-protocol" }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
ring = "0.17"
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "net", "io-util"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[lints]
workspace = true

[package]
name = "canopy-data"
description = "Canopy's data plane read execution: callers and context lookups, policy filters and field rules, query limits, keyset cursors and snapshot pages read from MongoDB as raw BSON."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
canopy-engine = { path = "../canopy-engine" }
canopy-matcher = { path = "../canopy-matcher" }
canopy-mongo = { path = "../canopy-mongo" }
canopy-policy = { path = "../canopy-policy" }
canopy-protocol = { path = "../canopy-protocol" }
canopy-query = { path = "../canopy-query" }
canopy-schema = { path = "../canopy-schema" }
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
ring = "0.17"
tokio = { version = "1", features = ["rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true

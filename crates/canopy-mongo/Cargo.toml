[package]
name = "canopy-mongo"
description = "Canopy's MongoDB access for snapshot reads, raw BSON cursors, policies and stream checkpoints."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
canopy-engine = { path = "../canopy-engine" }
canopy-matcher = { path = "../canopy-matcher" }
canopy-policy = { path = "../canopy-policy" }
canopy-protocol = { path = "../canopy-protocol" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
mongodb = { version = "=3.10.1", default-features = false, features = ["bson-3", "compat-3-3-0", "dns-resolver", "rustls-tls"] }
tokio = { version = "1", features = ["sync"] }

[lints]
workspace = true

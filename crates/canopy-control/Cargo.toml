[package]
name = "canopy-control"
description = "Canopy's control plane: the /admin/v1 API, admin accounts with TOTP, sessions, CSRF and admin tokens, and the RBAC of the admin roles."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
base64 = "0.22"
canopy-config = { path = "../canopy-config" }
canopy-http = { path = "../canopy-http" }
canopy-migrations = { path = "../canopy-migrations" }
canopy-mongo = { path = "../canopy-mongo" }
canopy-policy = { path = "../canopy-policy" }
canopy-protocol = { path = "../canopy-protocol" }
canopy-webhooks = { path = "../canopy-webhooks" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
ring = "0.17"
scrypt = { version = "0.11", default-features = false }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
unicode-normalization = "0.1"

[dev-dependencies]
regex = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true

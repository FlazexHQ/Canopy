[package]
name = "canopy-control"
description = "Canopy's control plane: the /admin/v1 API, admin accounts with TOTP, sessions, CSRF and admin tokens, and the RBAC of the admin roles."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
base64 = "0.22"
canopy-auth = { path = "../canopy-auth" }
canopy-authn = { path = "../canopy-authn" }
canopy-graphql = { path = "../canopy-graphql" }
canopy-config = { path = "../canopy-config" }
canopy-data = { path = "../canopy-data" }
canopy-http = { path = "../canopy-http" }
canopy-mail = { path = "../canopy-mail" }
canopy-migrations = { path = "../canopy-migrations" }
canopy-mongo = { path = "../canopy-mongo" }
canopy-policy = { path = "../canopy-policy" }
canopy-protocol = { path = "../canopy-protocol" }
canopy-webhooks = { path = "../canopy-webhooks" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
regex = "1"
url = "2"
ring = "0.17"
scrypt = { version = "0.11", default-features = false }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
unicode-normalization = "0.1"

[dev-dependencies]
serde_json = "1"
canopy-engine = { path = "../canopy-engine" }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true

[package]
name = "canopy-graphql"
description = "Canopy's GraphQL API in the data plane: the schema each role set sees, generated from the policies and collection schemas, and an executor that turns root fields and relation levels into reads and writes of canopy-data."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
apollo-compiler = "=1.33.1"
canopy-data = { path = "../canopy-data" }
canopy-engine = { path = "../canopy-engine" }
canopy-http = { path = "../canopy-http" }
canopy-matcher = { path = "../canopy-matcher" }
canopy-policy = { path = "../canopy-policy" }
canopy-protocol = { path = "../canopy-protocol" }
serde_json_bytes = { version = "0.2", features = ["preserve_order"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
canopy-auth = { path = "../canopy-auth" }
canopy-mongo = { path = "../canopy-mongo" }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true

[package]
name = "canopy-policy"
description = "Canopy's Document Level Security: the stored policy format, the compiler to MongoDB filters and in process matchers, variables, context lookups, field rules, immutable fields and explain."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
canopy-matcher = { path = "../canopy-matcher" }
canopy-protocol = { path = "../canopy-protocol" }
canopy-query = { path = "../canopy-query" }

[dev-dependencies]
mongodb = { version = "=3.10.1", default-features = false, features = ["bson-3", "compat-3-3-0", "dns-resolver", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true

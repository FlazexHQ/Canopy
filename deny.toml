# cargo deny check: licenses, advisories, bans and sources of every crate the Cargo workspace builds.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# The set the npm packages allow: MIT, Apache 2.0, BSD, ISC.
allow = ["MIT", "MIT-0", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "0BSD"]
confidence-threshold = 0.93
unused-allowed-license = "allow"
exceptions = [
  # Needed by every procedural macro (through proc-macro2, under napi-derive and futures-macro), so it runs
  # in the compiler only and is never linked into the addon: `cargo tree -i unicode-ident -e no-proc-macro`
  # prints nothing. Unicode 3.0 is a permissive, OSI approved license for its Unicode data tables.
  { allow = ["Unicode-3.0"], crate = "unicode-ident" },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

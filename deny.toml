# cargo deny check: licenses, advisories, bans and sources of every crate the Cargo workspace builds.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# The set the npm packages allow: MIT, Apache 2.0, BSD, ISC.
allow = ["MIT", "MIT-0", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "0BSD"]
confidence-threshold = 0.93
unused-allowed-license = "allow"
exceptions = [
  # Compiled into procedural macros only (proc-macro2, under napi-derive and futures-macro), never linked into
  # the addon. Pending the maintainer's decision on Unicode 3.0.
  { allow = ["Unicode-3.0"], crate = "unicode-ident" },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
